<!-- Only this app's own files run. Network: the Anthropic API (your own key) and Apple's
     song search; images: album art from Apple. Inline styles are allowed for layout.
     Apple Music (off unless turned on): MusicKit from Apple and its token from a workers.dev Worker.
     MusicKit also fetches a certificate bundle from s.mzstatic.com and streams audio from Apple's CDNs (3.10.2). -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://itunes.apple.com https://*.apple.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.mzstatic.com https://tile.openstreetmap.org; connect-src 'self' https://api.anthropic.com https://itunes.apple.com https://*.apple.com https://lrclib.net https://api.getsong.co https://api.open-meteo.com https://geocoding-api.open-meteo.com https://*.workers.dev https://*.mzstatic.com https://*.cdn-apple.com https://*.aaplimg.com; media-src 'self' blob: https://*.apple.com https://*.mzstatic.com https://*.cdn-apple.com https://*.aaplimg.com; object-src 'none'; base-uri 'none'; form-action 'none'">

<link rel="modulepreload" href="sets.js">
