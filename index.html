<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#0c0d0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tabs">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Tabs</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root {
  --bg: #0c0d0f;
  --bg-glow: rgba(255,255,255,0.05);
  --fg: #f3f1ee;
  --fg-2: #c9c7c3;
  --muted: #8f8e8c;
  --accent: #eda27f;
  --accent-deep: #c97a57;
  --on-accent: #1a120d;
  --accent-soft: rgba(237,162,127,0.13);
  --accent-line: rgba(237,162,127,0.4);
  --card: rgba(255,255,255,0.035);
  --card-2: rgba(255,255,255,0.07);
  --rim: rgba(255,255,255,0.09);
  --hair: rgba(255,255,255,0.07);
  --rim-hi: rgba(255,255,255,0.12);
  --bar: rgba(38,39,42,0.86);
  --solid: #1b1c1f;
  --scrim: rgba(4,4,5,0.6);
  --shadow: 0 8px 24px rgba(0,0,0,0.4);
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif;
  --serif: "New York", ui-serif, "Iowan Old Style", Charter, Georgia, serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Roboto Mono", monospace;
  --r: 12px;
  --r-bar: 14px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #f3f0eb;
  --bg-glow: rgba(255,255,255,0.8);
  --fg: #1d1c1a;
  --fg-2: #3b3936;
  --muted: #76736e;
  --accent: #c46f48;
  --accent-deep: #a95a37;
  --on-accent: #fff8f3;
  --accent-soft: rgba(196,111,72,0.1);
  --accent-line: rgba(196,111,72,0.4);
  --card: rgba(255,255,255,0.6);
  --card-2: rgba(255,255,255,0.92);
  --rim: rgba(0,0,0,0.08);
  --hair: rgba(0,0,0,0.07);
  --rim-hi: rgba(255,255,255,0.9);
  --bar: rgba(255,255,255,0.86);
  --solid: #fbf9f6;
  --scrim: rgba(40,30,20,0.28);
  --shadow: 0 8px 24px rgba(60,40,20,0.12);
  color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { background: var(--bg); }
body {
  margin: 0; min-height: 100dvh; color: var(--fg); font-family: var(--sans); font-size: 16px;
  background: radial-gradient(120% 50% at 50% -10%, var(--bg-glow), transparent 60%), var(--bg);
  background-attachment: fixed; -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
input, textarea { outline: none; }
::placeholder { color: var(--muted); }
svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }

.app { max-width: 520px; margin: 0 auto; padding: calc(18px + var(--safe-t)) 20px calc(110px + var(--safe-b)); }

/* Surfaces */
.glass {
  background: linear-gradient(180deg, var(--card-2), var(--card));
  border: 1px solid var(--rim);
  box-shadow: inset 0 1px 0 var(--rim-hi);
}
.float { box-shadow: inset 0 1px 0 var(--rim-hi), var(--shadow); -webkit-backdrop-filter: blur(22px) saturate(150%); backdrop-filter: blur(22px) saturate(150%); background: var(--bar); }

/* Header */
.head { display: flex; align-items: center; justify-content: space-between; min-height: 44px; margin-bottom: 4px; }
.title { font-family: var(--serif); font-weight: 400; font-size: 40px; letter-spacing: -0.01em; line-height: 1.1; margin: 0; }
.ib { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; padding: 0; color: var(--fg-2); flex: none; position: relative; }
.ib::after { content: ""; position: absolute; inset: -4px; }
.ib.on { color: var(--accent); }
.ib.on svg { fill: var(--accent); }
.row-btns { display: flex; gap: 10px; }
/* Song view back button floats; it fades out scrolling down and back in scrolling up */
/* Compact song header: fades out scrolling down, fades in scrolling up */
.chead { position: fixed; z-index: 25; left: 0; right: 0; top: 0; padding-top: calc(10px + var(--safe-t)); opacity: 0; pointer-events: none; transition: opacity .12s linear; }
.chead::before { content: ""; position: absolute; inset: 0 0 -18px; background: var(--bar); -webkit-backdrop-filter: blur(22px) saturate(150%); backdrop-filter: blur(22px) saturate(150%);
  -webkit-mask-image: linear-gradient(180deg, #000 calc(100% - 26px), transparent); mask-image: linear-gradient(180deg, #000 calc(100% - 26px), transparent); }
.chead .in { position: relative; max-width: 520px; margin: 0 auto; padding: 0 20px 8px; display: flex; align-items: center; gap: 12px; height: 56px; }
.chead .ctitle { flex: 1; min-width: 0; border: 0; background: none; padding: 4px 0; text-align: left; color: var(--fg); }
.chead .ct { font-family: var(--serif); font-size: 17px; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chead .cs { font-size: 12.5px; color: var(--muted); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chead .cs b { color: var(--fg-2); font-weight: 500; }

/* Chips */
.chips { display: flex; gap: 8px; margin: 14px 0 0; }
.chip { height: 28px; padding: 0 12px; border-radius: 14px; font-size: 13px; border: 1px solid var(--rim); background: var(--card); color: var(--muted); }
.chip.on { color: var(--accent); border-color: var(--accent-line); background: var(--accent-soft); }

/* Sections and lists */
.label { font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin: 22px 4px 8px; }
.list { border-radius: 16px; overflow: hidden; }
.row { display: flex; align-items: center; gap: 10px; width: 100%; height: 60px; padding: 0 16px; border: 0; border-bottom: 1px solid var(--hair); background: none; text-align: left; color: var(--fg); }
.row:last-child { border-bottom: 0; }
.row:active { background: var(--card-2); }
.row .txt { flex: 1; min-width: 0; }
.row .t { font-size: 16px; font-weight: 500; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .a { font-size: 13.5px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .k { font: 500 13px var(--mono); color: var(--muted); min-width: 30px; text-align: right; }
.heart { width: 14px; height: 14px; fill: var(--accent); flex: none; }
.recent { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.rc { border-radius: 14px; padding: 12px 14px; text-align: left; color: var(--fg); min-width: 0; }
.rc .t { font-size: 15px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rc .a { font-size: 12.5px; color: var(--muted); margin-top: 3px; }
.empty { color: var(--muted); text-align: center; padding: 56px 24px; line-height: 1.6; font-size: 15px; }

/* Bottom bars */
.dock { position: fixed; left: 50%; bottom: calc(14px + var(--safe-b)); width: min(496px, calc(100% - 24px)); transform: translateX(-50%); z-index: 20; display: flex; gap: 10px; transition: transform .15s; }
.dock-fade { position: fixed; left: 0; right: 0; bottom: 0; height: calc(110px + var(--safe-b)); background: linear-gradient(180deg, transparent, var(--bg) 70%); pointer-events: none; z-index: 10; }
.cmd { flex: 1; min-width: 0; height: 52px; border-radius: var(--r-bar); display: flex; align-items: center; gap: 10px; padding: 0 8px 0 16px; }
.cmd svg { color: var(--accent); }
.cmd input { flex: 1; min-width: 0; border: 0; background: none; font-size: 16px; height: 100%; }
.cmd .clear[hidden] { display: none; }
.cmd .clear { width: 32px; height: 32px; border: 0; background: none; color: var(--muted); display: grid; place-items: center; padding: 0; }
.add { width: 52px; height: 52px; border-radius: var(--r-bar); border: 0; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; flex: none; box-shadow: 0 6px 18px color-mix(in srgb, var(--accent) 30%, transparent); }
.add svg { width: 20px; height: 20px; stroke-width: 2.2; }

/* Song view */
.song-title { font-family: var(--serif); font-weight: 400; font-size: 36px; letter-spacing: -0.01em; line-height: 1.1; margin: 18px 0 6px; overflow-wrap: anywhere; }
.meta { color: var(--muted); font-size: 14px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }
.meta .dot { width: 4px; height: 4px; border-radius: 50%; background: var(--accent); }
.meta b { color: var(--fg-2); font-weight: 500; }
.sheet { font-size: var(--lyric-size, 17px); line-height: 1.45; overflow-wrap: anywhere; }
.sheet .sec { font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin: 18px 0 4px; }
.sheet .sec:first-child { margin-top: 4px; }
.sheet .gap { height: 0.7em; }
.sheet .ly { margin: 0 0 0.5em; }
/* Chord-over-word blocks: each word stays whole; lines wrap between words */
.sheet .pr { margin: 0 0 0.55em; }
.sheet .w { white-space: nowrap; }
.sheet .sg { display: inline-block; vertical-align: baseline; }
.sheet .sg > .c { display: block; line-height: 1.25; padding-right: 0.45em; min-height: 1.25em; }
.sheet .sg > .l { white-space: pre; }
.sheet .sg.free > .c { width: 0; overflow: visible; white-space: nowrap; padding-right: 0; }
.sheet { overflow-x: clip; position: relative; }
.sheet .c[data-ch] { cursor: pointer; position: relative; }
.sheet .c[data-ch]::after { content: ""; position: absolute; inset: -6px -4px; }
.sheet .c.sel .ct { background: var(--accent-soft); border-radius: 4px; box-shadow: 0 0 0 3px var(--accent-soft), 0 0 0 4px var(--accent-line); }
/* Chord diagram cards */
.prow { position: absolute; left: 0; right: 0; height: 0; z-index: 5; pointer-events: none; animation: fade .25s ease-out; }
.pcard, .dpop { position: absolute; top: 0; box-sizing: border-box; border-radius: 10px; background: var(--solid); border: 1px solid var(--rim); box-shadow: 0 6px 18px rgba(0,0,0,0.4); display: grid; place-items: center; }
.dpop { z-index: 6; animation: pop .16s ease-out; }
@keyframes pop { from { opacity: 0; transform: translateY(4px) scale(.96); } }
.dptr { position: absolute; bottom: -5px; width: 8px; height: 8px; margin-left: -4px; transform: rotate(45deg); background: var(--solid); border-right: 1px solid var(--rim); border-bottom: 1px solid var(--rim); }
.pcard svg, .dpop svg { display: block; }
.dn { font: 600 10.5px var(--sans); fill: var(--fg); }
.dx { stroke: var(--muted); stroke-width: 1.1; stroke-linecap: round; fill: none; }
.do { fill: none; stroke: var(--fg-2); stroke-width: 1; }
.dnut { fill: var(--fg); }
.df { stroke: var(--fg); stroke-opacity: .38; stroke-width: .8; }
.ds { stroke: var(--fg); stroke-opacity: .55; stroke-width: .8; }
.dd { fill: var(--accent); }
.dk { font: 700 5.4px var(--sans); fill: var(--on-accent); }
.db { font: 7px var(--sans); fill: var(--muted); }
.sheet .c { color: var(--accent); font-weight: 650; font-size: 0.88em; letter-spacing: 0.01em; }
.sheet .crow { display: flex; flex-wrap: wrap; column-gap: 1.1em; row-gap: 0.2em; margin: 0 0 0.55em; }
/* Tabs: all strings wrap together, a measure at a time */
.sheet .tab { font-family: var(--mono); font-size: var(--tab-size, 14px); line-height: 1.35; white-space: pre; margin: 0 0 1em; color: var(--fg); }
.sheet .tab + .tab { margin-top: -0.2em; }
.pw { flex: 1; min-width: 0; border-radius: var(--r-bar); overflow: hidden; }
.player { height: 56px; display: flex; align-items: center; gap: 12px; padding: 0 8px; }
/* Now and Next: a fixed panel in the dock while playing; only its contents change */
.nn { display: none; align-items: flex-end; gap: 14px; padding: 12px 14px; border-bottom: 1px solid var(--hair); }
body.nn-on .nn { display: flex; animation: nnin .2s ease-out; }
@keyframes nnin { from { opacity: 0; } }
.nn .lab { font-size: 10px; font-weight: 600; letter-spacing: 0.14em; color: var(--muted); margin: 0 0 6px 2px; }
.nn .nowcol .lab { color: var(--accent); }
.nn .vs { width: 1px; align-self: stretch; background: var(--rim); }
.nn .cards { display: flex; gap: 8px; align-items: flex-end; min-width: 0; overflow: hidden; }
.nn .card { flex: none; border-radius: 10px; background: var(--solid); border: 1px solid var(--rim); display: grid; place-items: center; box-sizing: border-box; }
.nn .card svg { display: block; }
.nn .swap { animation: swap .16s ease-out; }
@keyframes swap { from { opacity: .3; } }
/* Chords in this song */
.strip-h { display: flex; justify-content: space-between; align-items: baseline; margin: 0 2px 8px; font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.strip-h .n { font-weight: 500; letter-spacing: 0; }
.strip { display: flex; gap: 8px; overflow-x: auto; margin: 0 -20px 10px; padding: 2px 20px 8px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
.strip::-webkit-scrollbar { display: none; }
.scard { flex: none; width: 54px; height: 78px; padding: 0; border-radius: 10px; background: var(--solid); border: 1px solid var(--rim); display: grid; place-items: center; }
.scard svg { display: block; }
.scard.sel { border-color: transparent; box-shadow: 0 0 0 1.5px var(--accent); }
.nn .none { color: var(--muted); font-size: 13px; padding: 0 2px 6px; }
body.nn-on .app.viewer { padding-bottom: calc(250px + var(--safe-b)); }
/* Current line focus while playing: other lines dim in place (no motion) */
.sheet > * { transition: opacity .3s; }
.sheet.focus > *:not(.cur):not(.prow):not(.dpop) { opacity: .38; }
.sheet .c.now .ct { box-shadow: inset 0 -2px 0 var(--accent); }
.play { width: 40px; height: 40px; border-radius: 10px; border: 0; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; flex: none; padding: 0; }
.play svg { width: 16px; height: 16px; fill: currentColor; stroke: none; }
.speed { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; }
.speed span { font: 500 13px var(--mono); color: var(--fg-2); width: 34px; text-align: right; }
.vsep { width: 1px; height: 26px; background: var(--rim); }
.step { display: flex; align-items: center; gap: 4px; }
.sb { width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--rim); background: var(--card); color: var(--fg-2); display: grid; place-items: center; padding: 0; }
.sb svg { width: 14px; height: 14px; }
.sb.nnbtn svg { width: 16px; height: 16px; }
.sb.on { color: var(--accent); border-color: var(--accent-line); background: var(--accent-soft); }
.step .v { font: 600 13px var(--mono); color: var(--accent); min-width: 28px; text-align: center; }
.step .v.zero { color: var(--muted); font-weight: 500; }

input[type=range] { -webkit-appearance: none; appearance: none; flex: 1; min-width: 0; height: 28px; background: none; margin: 0; }
input[type=range]::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: linear-gradient(90deg, var(--accent) var(--fill, 50%), var(--card-2) var(--fill, 50%)); }
input[type=range]::-moz-range-track { height: 4px; border-radius: 2px; background: linear-gradient(90deg, var(--accent) var(--fill, 50%), var(--card-2) var(--fill, 50%)); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; margin-top: -7px; border-radius: 50%; background: #f6c3a8; border: 0; box-shadow: 0 2px 6px rgba(0,0,0,0.4); }
input[type=range]::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%; background: #f6c3a8; border: 0; }

/* Sheets (add / edit / paste) */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 40; animation: fade .2s; }
.panel { position: fixed; left: 50%; transform: translateX(-50%); width: min(520px, 100%); z-index: 41; background: var(--solid); border: 1px solid var(--rim); }
.panel.full { top: calc(10px + var(--safe-t)); bottom: 0; border-radius: 18px 18px 0 0; border-bottom: 0; display: flex; flex-direction: column; animation: up .28s cubic-bezier(.2,.8,.2,1); }
.panel.card { bottom: calc(12px + var(--safe-b)); width: min(496px, calc(100% - 24px)); border-radius: 22px; padding: 16px; box-shadow: 0 -10px 50px rgba(0,0,0,0.5); animation: up .25s cubic-bezier(.2,.8,.2,1); }
@keyframes up { from { transform: translate(-50%, 40px); opacity: 0; } }
@keyframes fade { from { opacity: 0; } }
.grab { width: 36px; height: 5px; border-radius: 3px; background: var(--rim); margin: 8px auto 4px; flex: none; }
.ph { display: flex; align-items: center; justify-content: space-between; padding: 4px 8px 12px; flex: none; }
.ph h2 { font-size: 17px; font-weight: 600; margin: 0; }
.tb { border: 0; background: none; font-size: 16px; padding: 8px 10px; color: var(--fg-2); }
.tb.go { color: var(--accent); font-weight: 600; }
.pbody { flex: 1; overflow-y: auto; padding: 0 16px calc(20px + var(--safe-b)); display: flex; flex-direction: column; }
.fields { border-radius: var(--r); margin-bottom: 12px; }
.fld { display: flex; align-items: center; gap: 12px; min-height: 46px; padding: 0 14px; border-bottom: 1px solid var(--hair); }
.fld:last-child { border-bottom: 0; }
.fld .lab { width: 54px; font-size: 15px; color: var(--muted); flex: none; }
.fld input { flex: 1; min-width: 0; border: 0; background: none; font-size: 16px; height: 44px; }
.seg { display: flex; padding: 2px; border-radius: 9px; background: var(--card-2); flex: 1; }
.seg button { flex: 1; height: 28px; border-radius: 7px; border: 0; background: none; color: var(--muted); font-size: 14px; font-weight: 500; }
.seg button.on { background: var(--accent-soft); color: var(--accent); }
textarea.body { flex: 1; min-height: 260px; width: 100%; border-radius: var(--r); padding: 14px; font: 14px/1.55 var(--mono); resize: none; white-space: pre; overflow: auto; }
.detect { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 13px; color: var(--muted); min-height: 18px; }
.detect svg { color: var(--accent); width: 15px; height: 15px; }
.danger { margin-top: 18px; border: 0; background: none; color: #e07a6c; font-size: 15px; padding: 10px; }
.pc-head { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--fg-2); margin-bottom: 12px; }
.pc-head svg { color: var(--accent); width: 16px; height: 16px; }
.preview { border-radius: var(--r); background: var(--card); border: 1px solid var(--hair); padding: 10px 14px; height: 96px; overflow: hidden; font: 13px/1.5 var(--mono); white-space: pre; margin-bottom: 12px; -webkit-mask-image: linear-gradient(180deg, #000 55%, transparent); mask-image: linear-gradient(180deg, #000 55%, transparent); }
.preview .ch { color: var(--accent); font-weight: 600; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.tag { height: 26px; padding: 0 10px; border-radius: 13px; font-size: 12.5px; display: inline-flex; align-items: center; border: 1px solid var(--accent-line); color: var(--accent); background: var(--accent-soft); }
.actions { display: flex; gap: 10px; margin-top: 2px; }
.btn { height: 46px; border-radius: var(--r); font-size: 15px; font-weight: 500; border: 1px solid var(--rim); background: var(--card); color: var(--fg-2); flex: 1; }
.btn.primary { flex: 2; border: 0; background: var(--accent); color: var(--on-accent); font-weight: 600; }

/* Settings */
.set-group { border-radius: 16px; overflow: hidden; margin-top: 8px; }
.set { position: relative; display: flex; align-items: center; gap: 14px; width: 100%; min-height: 52px; padding: 0 14px; border: 0; border-bottom: 1px solid var(--hair); background: none; text-align: left; color: var(--fg); font-size: 16px; }
.set:last-child { border-bottom: 0; }
.set .tile { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; background: var(--card-2); border: 1px solid var(--rim); color: var(--fg-2); flex: none; }
.set .tile svg { width: 17px; height: 17px; }
.set .name { flex: 1; }
.set .val { color: var(--accent); font-size: 15px; }
.set .chev { color: var(--muted); width: 16px; height: 16px; }
.set select { position: absolute; inset: 0; opacity: 0; width: 100%; font-size: 16px; }
.toggle { width: 51px; height: 31px; border-radius: 16px; position: relative; flex: none; border: 0; padding: 0; background: var(--card-2); box-shadow: inset 0 0 0 1px var(--rim); transition: background .2s; }
.toggle::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,0.3); transition: transform .2s; }
.toggle.on { background: var(--accent); box-shadow: none; }
.toggle.on::after { transform: translateX(20px); }
.foot { color: var(--muted); font-size: 13px; line-height: 1.5; margin: 14px 6px 0; }

.toast { position: fixed; left: 50%; top: calc(12px + var(--safe-t)); transform: translate(-50%, -150%); padding: 10px 16px; border-radius: var(--r); z-index: 60; transition: transform .25s; font-size: 14px; background: var(--solid); border: 1px solid var(--rim); box-shadow: var(--shadow); }
.toast.show { transform: translate(-50%, 0); }
</style>
</head>
<body>
<div class="app" id="app"></div>
<div id="layer"></div>
<div class="toast" id="toast" role="status"></div>
<script type="module">
import { Tabs, SPEEDS, parseSheet, parseBlocks, wrapTab, guessKey, transposeKey, prefersFlats, detectPaste, chordShape } from "./core.js";

// ---------- Icons ----------
const I = {
  search: '<circle cx="11" cy="11" r="7"/><path d="m20 20-3.8-3.8"/>',
  heart: '<path d="M12 20.5s-7.5-4.6-9.2-9.4C1.6 7.6 3.9 4.5 7.2 4.5c2 0 3.6 1.1 4.8 2.8 1.2-1.7 2.8-2.8 4.8-2.8 3.3 0 5.6 3.1 4.4 6.6-1.7 4.8-9.2 9.4-9.2 9.4z"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  minus: '<path d="M6 12h12"/>',
  x: '<path d="M7 7l10 10M17 7 7 17"/>',
  gear: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
  back: '<path d="m14.5 5-7 7 7 7"/>',
  chev: '<path d="m9 5 7 7-7 7"/>',
  edit: '<path d="M4 20h4L19 9l-4-4L4 16z"/>',
  gauge: '<path d="M4.5 17a9 9 0 1 1 15 0"/><path d="m12 13 3.5-4"/><circle cx="12" cy="13" r="1.2"/>',
  note: '<path d="M9 18V6l11-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/>',
  moon: '<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>',
  upload: '<path d="M12 15V4M7.5 8.5 12 4l4.5 4.5M4 14v5h16v-5"/>',
  download: '<path d="M12 4v11M7.5 10.5 12 15l4.5-4.5M4 14v5h16v-5"/>',
  focus: '<path d="M4 7h16"/><path d="M4 12h16" stroke-width="2.4"/><path d="M4 17h16"/>',
  fretboard: '<path d="M6 4h12M6 4v16M10 4v16M14 4v16M18 4v16M6 9h12M6 14h12"/><circle cx="10" cy="11.5" r="1.4" fill="currentColor"/><circle cx="14" cy="16.5" r="1.4" fill="currentColor"/>',
  clip: '<rect x="6" y="4" width="12" height="17" rx="2"/><path d="M9 4.5V3h6v1.5"/>',
  check: '<path d="M5 12l4 4 10-10"/>',
  play: '<path d="M8 5.5v13a1 1 0 0 0 1.5.9l10.4-6.5a1 1 0 0 0 0-1.8L9.5 4.6A1 1 0 0 0 8 5.5z"/>',
  pause: '<rect x="6" y="5" width="4" height="14" rx="1.3"/><rect x="14" y="5" width="4" height="14" rx="1.3"/>'
};
const icon = (n, cls = "") => `<svg class="i ${cls}" viewBox="0 0 24 24" aria-hidden="true">${I[n]}</svg>`;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const $ = id => document.getElementById(id);

// ---------- State ----------
let data = Tabs.load();
let query = "";
let filter = "all";
let draft = null; // prefilled fields for the add sheet
const app = $("app");
const layer = $("layer");

function applyTheme() {
  const light = data.settings.theme === "light";
  document.documentElement.dataset.theme = light ? "light" : "dark";
  document.querySelector('meta[name="theme-color"]').content = light ? "#f3f0eb" : "#0c0d0f";
}

function toast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => t.classList.remove("show"), 2000);
}

const go = h => { location.hash = h; };
const route = () => {
  const [, name = "", id = ""] = location.hash.split("/");
  return { name: name || "library", id: decodeURIComponent(id) };
};
const keyOf = s => s.format === "tab" ? "TAB" : (s.key || guessKey(s.body || ""));

// Keep bottom bars above the iOS keyboard.
function followKeyboard() {
  const vv = window.visualViewport;
  if (!vv) return;
  const off = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
  document.querySelectorAll(".kb").forEach(el => {
    el.style.transform = `translate(-50%, ${-off}px)`;
  });
}
window.visualViewport?.addEventListener("resize", followKeyboard);
window.visualViewport?.addEventListener("scroll", followKeyboard);

// ---------- Library ----------
function renderLibrary() {
  const hasFav = data.songs.some(s => s.favorite);
  const hasTab = data.songs.some(s => s.format === "tab");
  if ((filter === "fav" && !hasFav) || (filter === "tab" && !hasTab)) filter = "all";
  app.innerHTML = `
    <div class="head">
      <h1 class="title">Library</h1>
      <button class="ib glass" id="settings" aria-label="Settings">${icon("gear")}</button>
    </div>
    ${hasFav || hasTab ? `<div class="chips" id="chips">
      <button class="chip ${filter === "all" ? "on" : ""}" data-f="all">All</button>
      ${hasFav ? `<button class="chip ${filter === "fav" ? "on" : ""}" data-f="fav">Favorites</button>` : ""}
      ${hasTab ? `<button class="chip ${filter === "tab" ? "on" : ""}" data-f="tab">Tabs</button>` : ""}
    </div>` : ""}
    <div id="list"></div>
    <div class="dock-fade"></div>
    <div class="dock kb">
      <label class="cmd glass float">
        ${icon("search")}
        <input id="q" type="text" inputmode="search" enterkeyhint="go" placeholder="Search, or paste a song" value="${esc(query)}" autocomplete="off" autocorrect="off" spellcheck="false" aria-label="Search or paste a song">
        <button class="clear" id="clear" aria-label="Clear search" ${query ? "" : "hidden"}>${icon("x")}</button>
      </label>
      <button class="add" id="add" aria-label="Add song">${icon("plus")}</button>
    </div>`;
  $("settings").onclick = () => go("#/settings");
  $("add").onclick = () => { draft = null; go("#/add"); };
  app.querySelectorAll("[data-f]").forEach(b => b.onclick = () => { filter = b.dataset.f; renderLibrary(); });
  const q = $("q");
  q.oninput = () => { query = q.value; $("clear").hidden = !query; renderList(); };
  q.onkeydown = e => {
    if (e.key !== "Enter") return;
    const first = app.querySelector("#list .row");
    if (first) first.click();
  };
  q.addEventListener("paste", e => {
    const text = e.clipboardData?.getData("text") || "";
    if (text.trim().split("\n").filter(l => l.trim()).length < 2) return;
    e.preventDefault();
    q.blur();
    showPasteCard(detectPaste(text));
  });
  $("clear").onclick = e => { e.preventDefault(); query = ""; q.value = ""; $("clear").hidden = true; renderList(); q.focus(); };
  renderList();
  followKeyboard();
}

function songRow(s) {
  return `<button class="row" data-id="${esc(s.id)}">
    <div class="txt"><div class="t">${esc(s.title)}</div><div class="a">${esc(s.artist || "Unknown artist")}</div></div>
    ${s.favorite ? `<svg class="heart" viewBox="0 0 24 24" aria-label="Favorite" role="img">${I.heart}</svg>` : ""}
    <span class="k">${esc(keyOf(s))}</span>
  </button>`;
}

function renderList() {
  const list = $("list");
  if (!data.songs.length) {
    list.innerHTML = `<div class="empty">No songs yet.<br>Paste a chord sheet into the bar below,<br>or tap + to write one.</div>`;
    return;
  }
  const q = query.trim().toLowerCase();
  const songs = data.songs.filter(s =>
    (filter !== "fav" || s.favorite) && (filter !== "tab" || s.format === "tab") &&
    (!q || s.title.toLowerCase().includes(q) || (s.artist || "").toLowerCase().includes(q)));
  const recent = !q && filter === "all" && data.songs.length >= 4
    ? data.songs.filter(s => s.opened).sort((a, b) => b.opened - a.opened).slice(0, 2) : [];
  const sorted = [...songs].sort((a, b) => a.title.localeCompare(b.title));

  list.innerHTML = `
    ${recent.length ? `<div class="label">Recent</div><div class="recent">${recent.map(s => `
      <button class="rc glass" data-id="${esc(s.id)}">
        <div class="t">${esc(s.title)}</div>
        <div class="a">${s.format === "tab" ? "Tab" : `Key ${esc(transposeKey(keyOf(s), s.transpose || 0) || "?")}${s.transpose ? `, ${s.transpose > 0 ? "+" : ""}${s.transpose}` : ""}`}</div>
      </button>`).join("")}</div>` : ""}
    ${q ? "" : `<div class="label">${filter === "fav" ? "Favorites" : filter === "tab" ? "Tabs" : "All songs"}</div>`}
    ${sorted.length ? `<div class="list glass" style="${q ? "margin-top:18px" : ""}">${sorted.map(songRow).join("")}</div>` : `<div class="empty">No matches for "${esc(query)}".</div>`}`;
  list.querySelectorAll("[data-id]").forEach(el => el.onclick = () => go("#/song/" + encodeURIComponent(el.dataset.id)));
}

// ---------- Paste card ----------
function showPasteCard(d) {
  const preview = parseSheet(d.body).slice(0, 6).map(l =>
    l.kind === "chords" ? `<span class="ch">${esc(l.text)}</span>` : l.kind === "section" ? `[${esc(l.text)}]` : esc(l.text)).join("\n");
  const tags = [d.format === "tab" ? "Tab" : "Chords", d.key && `Key ${d.key}`, d.sections && `${d.sections} section${d.sections === 1 ? "" : "s"}`].filter(Boolean);
  layer.innerHTML = `
    <div class="scrim" id="scrim"></div>
    <div class="panel card kb" role="dialog" aria-label="Save pasted song">
      <div class="pc-head">${icon("clip")}<span>${d.format === "tab" ? "Tab" : "Chord sheet"} detected</span></div>
      <div class="preview">${preview}</div>
      <div class="tags">${tags.map(t => `<span class="tag">${esc(t)}</span>`).join("")}</div>
      <div class="fields glass">
        <label class="fld"><span class="lab">Title</span><input id="p-title" value="${esc(d.title)}" placeholder="Song title" autocomplete="off"></label>
        <label class="fld"><span class="lab">Artist</span><input id="p-artist" value="${esc(d.artist)}" placeholder="Optional" autocomplete="off"></label>
      </div>
      <div class="actions">
        <button class="btn" id="p-edit">Review</button>
        <button class="btn primary" id="p-save">Save to Library</button>
      </div>
    </div>`;
  const close = () => { layer.innerHTML = ""; };
  $("scrim").onclick = close;
  const fields = () => ({ title: $("p-title").value.trim(), artist: $("p-artist").value.trim(), format: d.format, key: "", body: d.body });
  $("p-save").onclick = () => {
    const f = fields();
    if (!f.title) { $("p-title").focus(); toast("Add a title first"); return; }
    const s = Tabs.addSong(data, f);
    close(); query = "";
    go("#/song/" + encodeURIComponent(s.id));
  };
  $("p-edit").onclick = () => { draft = fields(); close(); go("#/add"); };
  if (!d.title) setTimeout(() => $("p-title")?.focus(), 250);
  followKeyboard();
}

// ---------- Song view ----------
let scroll = { on: false, raf: 0, last: 0, carry: 0, lock: null };

function renderViewer(id) {
  const song = data.songs.find(s => s.id === id);
  if (!song) return go("#/");
  const isChords = song.format !== "tab";
  if (song.transpose === undefined) song.transpose = data.settings.transpose || 0;
  if (song.speed === undefined) song.speed = SPEEDS.medium; // 1.0x; each song then keeps its own
  if (song.size === undefined) song.size = 1;
  song.opened = Date.now();
  Tabs.save(data);

  app.classList.add("viewer");
  diag.armed = false; diag.rowKey = null; diag.pinned = null; diag.scrolling = false; diag.block = null;
  app.innerHTML = `
    <div class="head">
      <button class="ib glass" data-go="#/" aria-label="Back to library">${icon("back")}</button>
      <div class="row-btns">
        <button class="ib glass fav ${song.favorite ? "on" : ""}" aria-label="Favorite" aria-pressed="${!!song.favorite}">${icon("heart")}</button>
        <button class="ib glass" data-go="#/edit/${encodeURIComponent(song.id)}" aria-label="Edit song">${icon("edit")}</button>
      </div>
    </div>
    <h1 class="song-title">${esc(song.title)}</h1>
    <div class="meta" id="meta"></div>
    <div id="strip"></div>
    <header class="chead" id="chead" aria-hidden="true">
      <div class="in">
        <button class="ib glass" data-go="#/" aria-label="Back to library" tabindex="-1">${icon("back")}</button>
        <button class="ctitle" id="ctitle" aria-label="Back to top of song" tabindex="-1">
          <div class="ct">${esc(song.title)}</div>
          <div class="cs" id="csub"></div>
        </button>
        <button class="ib glass fav ${song.favorite ? "on" : ""}" aria-label="Favorite" aria-pressed="${!!song.favorite}" tabindex="-1">${icon("heart")}</button>
        <button class="ib glass" data-go="#/edit/${encodeURIComponent(song.id)}" aria-label="Edit song" tabindex="-1">${icon("edit")}</button>
      </div>
    </header>
    <div class="sheet" id="sheet"></div>
    <div class="dock-fade"></div>
    <div class="dock">
      <div class="pw glass float">
      <div class="nn" id="nn"></div>
      <div class="player">
        <button class="play" id="play" aria-label="Start auto-scroll">${icon("play")}</button>
        <div class="speed">
          <input type="range" id="speed" min="4.5" max="99" step="4.5" value="${song.speed}" aria-label="Scroll speed for this song">
          <span id="sv"></span>
        </div>
        ${isChords ? `<button class="sb nnbtn ${data.settings.diagrams === true ? "on" : ""}" id="nnbtn" aria-label="Now and Next chords" aria-pressed="${data.settings.diagrams === true}">${icon("fretboard")}</button>` : ""}
        <div class="vsep"></div>
        <div class="step" aria-label="${isChords ? "Transpose" : "Text size"}">
          <button class="sb" id="down" aria-label="${isChords ? "Transpose down" : "Smaller text"}">${icon("minus")}</button>
          <span class="v" id="val"></span>
          <button class="sb" id="up" aria-label="${isChords ? "Transpose up" : "Larger text"}">${icon("plus")}</button>
        </div>
      </div>
      </div>
    </div>`;
  app.querySelectorAll("[data-go]").forEach(b => b.onclick = () => go(b.dataset.go));
  app.querySelectorAll(".fav").forEach(b => b.onclick = () => {
    Tabs.toggleFavorite(data, song.id);
    app.querySelectorAll(".fav").forEach(x => {
      x.classList.toggle("on", !!song.favorite);
      x.setAttribute("aria-pressed", !!song.favorite);
    });
  });
  $("ctitle").onclick = () => {
    hold.active = true; releaseSoon(900); // let the jump finish before auto-scroll resumes
    window.scrollTo({ top: 0, behavior: "smooth" });
  };

  const draw = () => {
    const steps = song.transpose || 0;
    const baseKey = isChords ? (song.key || guessKey(song.body || "")) : "";
    const key = transposeKey(baseKey, steps);
    $("meta").innerHTML = [
      song.artist && `<span>${esc(song.artist)}</span>`,
      key && `<span>Key <b>${esc(key)}</b></span>`,
      !isChords && `<span>Tab</span>`
    ].filter(Boolean).join('<span class="dot"></span>');
    $("csub").innerHTML = [song.artist && esc(song.artist), key && `Key <b>${esc(key)}</b>`, !isChords && "Tab"]
      .filter(Boolean).join(" · ");
    const sheet = $("sheet");
    const val = $("val");
    sheet.style.setProperty("--tab-size", (14 * song.size).toFixed(1) + "px");
    renderBlocks(sheet, parseBlocks(song.body || "", isChords ? steps : 0, isChords && prefersFlats(baseKey, steps)));
    renderStrip(sheet, isChords);
    layoutDiagrams(sheet, isChords);
    if (isChords) {
      val.textContent = steps ? (steps > 0 ? "+" : "") + steps : "0";
      val.classList.toggle("zero", !steps);
    } else {
      val.textContent = Math.round(song.size * 100) + "%";
      val.classList.toggle("zero", song.size === 1);
    }
  };
  draw();
  redraw = draw;

  const speed = $("speed");
  const showSpeed = () => {
    speed.style.setProperty("--fill", ((speed.value - 4.5) / 94.5 * 100) + "%");
    $("sv").textContent = (speed.value / SPEEDS.medium).toFixed(1) + "x";
  };
  showSpeed();
  speed.oninput = () => { song.speed = +speed.value; showSpeed(); Tabs.save(data); };

  const step = dir => {
    if (isChords) song.transpose = ((((song.transpose || 0) + dir) + 17) % 12) - 5; // -5..+6
    else song.size = Math.min(1.6, Math.max(0.6, +(song.size + dir * 0.1).toFixed(2)));
    Tabs.save(data);
    draw();
  };
  $("down").onclick = () => step(-1);
  $("up").onclick = () => step(1);
  $("play").onclick = () => scroll.on ? stopScroll() : startScroll(song);
  $("nnbtn")?.addEventListener("click", () => {
    const on = data.settings.diagrams !== true;
    data.settings.diagrams = on;
    Tabs.save(data);
    $("nnbtn").classList.toggle("on", on);
    $("nnbtn").setAttribute("aria-pressed", on);
    diag.nn = on && diag.seq.length > 0;
    diag.idx = null;
    updateDiagrams();
    toast(on ? "Now and Next on" : "Now and Next off");
  });
  window.scrollTo(0, 0);
  fab.lastY = 0; fab.reveal = 1;
}

// Render display blocks. Chord/lyric pairs wrap between words with chords riding
// on their word; tab systems are re-wrapped by measure to the screen width.
let redraw = null;
function chordLabel(text) {
  const name = String(text).split(/\s+/)[0].replace(/^\(|\)$/g, "");
  return chordShape(name) ? `<span class="c" data-ch="${esc(name)}"><span class="ct">${esc(text)}</span></span>` : `<span class="c">${esc(text)}</span>`;
}
function renderBlocks(sheet, blocks) {
  const word = w => w.space ? " " : `<span class="w">${w.parts.map(p => p.chord
    ? `<span class="sg${p.free ? " free" : ""}">${chordLabel(p.chord)}<span class="l">${esc(p.text)}</span></span>`
    : esc(p.text)).join("")}</span>`;
  sheet.innerHTML = blocks.map((b, i) => {
    if (b.kind === "section") return `<div class="sec">${esc(b.text)}</div>`;
    if (b.kind === "blank") return `<div class="gap"></div>`;
    if (b.kind === "lyric") return `<div class="ly">${esc(b.text)}</div>`;
    if (b.kind === "chords") return `<div class="crow">${b.items.map(chordLabel).join("")}</div>`;
    if (b.kind === "pair") return `<div class="pr">${b.words.map(word).join("")}</div>`;
    return `<div class="tabsys" data-i="${i}"></div>`;
  }).join("");

  const systems = sheet.querySelectorAll(".tabsys");
  if (!systems.length) return;
  // Measure one monospace character at the current tab size.
  const probe = document.createElement("span");
  probe.className = "tab";
  probe.style.cssText = "position:absolute;visibility:hidden;margin:0";
  probe.textContent = "0".repeat(40);
  sheet.appendChild(probe);
  const cols = Math.max(12, Math.floor(sheet.clientWidth / (probe.getBoundingClientRect().width / 40)));
  probe.remove();
  systems.forEach(el => {
    el.innerHTML = wrapTab(blocks[+el.dataset.i].lines, cols)
      .map(rows => `<div class="tab">${rows.map(esc).join("\n")}</div>`).join("");
  });
}
// ---------- Chord diagrams ----------
// Paused: tap any chord for its fingering. Playing: a fixed Now and Next panel in
// the dock shows the chord at the reading line and the ones coming up, and the
// current line stays bright while the others dim. Nothing moves over the lyrics.
const CARD_W = 54, CARD_H = 78;
const READ_AT = 0.4; // reading line, as a share of screen height
let diag = { seq: [], blocks: [], idx: null, block: null, nn: true, focus: true };

function chordSVG(name, scale = 1) {
  const c = chordShape(name);
  if (!c) return "";
  const sx = i => 9 + i * 7.2, top = 30, fh = 10, base = c.base || 1;
  const rowY = f => top + (f - base + 0.5) * fh;
  let g = `<text x="26" y="13" text-anchor="middle" class="dn">${esc(name)}</text>`;
  c.frets.forEach((f, i) => {
    if (f < 0) g += `<path class="dx" d="M${sx(i) - 2.4} 21.5L${sx(i) + 2.4} 26.5M${sx(i) + 2.4} 21.5L${sx(i) - 2.4} 26.5"/>`;
    else if (f === 0) g += `<circle class="do" cx="${sx(i)}" cy="24" r="2.4"/>`;
  });
  if (base === 1) g += `<rect class="dnut" x="8" y="28.5" width="37.5" height="2.2" rx=".6"/>`;
  for (let k = 0; k <= 4; k++) g += `<line class="df" x1="9" y1="${top + k * fh}" x2="45" y2="${top + k * fh}"/>`;
  for (let i = 0; i < 6; i++) g += `<line class="ds" x1="${sx(i)}" y1="30" x2="${sx(i)}" y2="70"/>`;
  const b = c.barre;
  if (b) g += `<rect class="dd" x="${sx(b.from) - 3.5}" y="${rowY(b.fret) - 3.5}" width="${sx(b.to) - sx(b.from) + 7}" height="7" rx="3.5"/>`;
  c.frets.forEach((f, i) => {
    if (f <= 0 || (b && f === b.fret && i >= b.from && i <= b.to && c.fingers[i] === 1)) return;
    g += `<circle class="dd" cx="${sx(i)}" cy="${rowY(f)}" r="3.7"/>`;
    if (c.fingers[i]) g += `<text class="dk" x="${sx(i)}" y="${rowY(f) + 1.9}" text-anchor="middle">${c.fingers[i]}</text>`;
  });
  if (base > 1) g += `<text class="db" x="48" y="${rowY(base) + 2.4}">${base}</text>`;
  return `<svg width="${52 * scale}" height="${76 * scale}" viewBox="0 0 52 76" role="img" aria-label="${esc(name)} chord fingering">${g}</svg>`;
}

// Record every chord label and every line, top to bottom, for the reading line.
function layoutDiagrams(sheet, isChords) {
  sheet.querySelectorAll(".dpop, .prow").forEach(el => el.remove());
  const top = sheet.getBoundingClientRect().top;
  diag.seq = isChords ? [...sheet.querySelectorAll(".c[data-ch]")].map(el => ({
    el, name: el.dataset.ch, y: el.getBoundingClientRect().top - top
  })) : [];
  // Screen rows of chords, for the paused diagrams.
  const left0 = sheet.getBoundingClientRect().left;
  diag.rows = [];
  for (const it of diag.seq) {
    const r = it.el.getBoundingClientRect();
    let row = diag.rows.find(x => Math.abs(x.top - it.y) < 6);
    if (!row) diag.rows.push(row = { top: it.y, items: [] });
    if (!row.items.some(x => x.name === it.name)) row.items.push({ name: it.name, x: r.left - left0 + Math.min(r.width, 40) / 2 });
  }
  diag.blocks = [...sheet.children].filter(el => !el.classList.contains("dpop") && !el.classList.contains("prow"))
    .map(el => ({ el, y: el.getBoundingClientRect().top - top }));
  diag.nn = isChords && data.settings.diagrams === true && diag.seq.length > 0;
  diag.focus = ["always", "playing", "off"].includes(data.settings.focus) ? data.settings.focus : "always";
  diag.idx = null; diag.block = null; diag.rowKey = null;
  updateDiagrams();
  showPausedRow();
}

function card(name, scale, opacity = 1) {
  return `<div class="card" style="width:${(CARD_W * scale).toFixed(1)}px;height:${(CARD_H * scale).toFixed(1)}px;opacity:${opacity}">${chordSVG(name, scale)}</div>`;
}

function updateDiagrams() {
  const sheet = $("sheet");
  const playing = scroll.on && !!sheet;
  document.body.classList.toggle("nn-on", playing && diag.nn);
  if (!sheet) return;
  if (!playing) {
    sheet.querySelectorAll(".c.now").forEach(el => el.classList.remove("now"));
    diag.idx = null;
    if (!diag.scrolling) applyPaused();
    return;
  }
  sheet.classList.toggle("focus", diag.focus !== "off");
  const sheetTop = sheet.getBoundingClientRect().top;
  const line = window.innerHeight * READ_AT;

  // Current line: the last line whose top has reached the reading line.
  let b = 0;
  for (let i = 0; i < diag.blocks.length; i++) if (sheetTop + diag.blocks[i].y <= line) b = i;
  setCurrent(diag.blocks[b]?.el);

  if (!diag.nn) return;
  // Current chord: the last chord that has reached the reading line.
  let idx = 0;
  for (let i = 0; i < diag.seq.length; i++) if (sheetTop + diag.seq[i].y <= line) idx = i;
  if (idx === diag.idx) return;
  diag.seq[diag.idx]?.el.classList.remove("now");
  diag.idx = idx;
  const now = diag.seq[idx];
  now.el.classList.add("now");
  // Next: the following chords, skipping repeats of the one before.
  const next = [];
  let last = now.name;
  for (let i = idx + 1; i < diag.seq.length && next.length < 3; i++) {
    if (diag.seq[i].name !== last) { next.push(diag.seq[i].name); last = diag.seq[i].name; }
  }
  const fade = [0.85, 0.5, 0.28];
  $("nn").innerHTML = `
    <div class="nowcol"><div class="lab">NOW</div><div class="swap">${card(now.name, 1.26)}</div></div>
    <div class="vs"></div>
    <div style="min-width:0"><div class="lab">NEXT</div>
      <div class="cards swap">${next.length ? next.map((n, i) => card(n, 1, fade[i])).join("") : `<div class="none">End of song</div>`}</div>
    </div>`;
}

// Tap a chord: show its card above it until the next tap.
// ---------- Current line when paused ----------
// The same line gets focus and diagrams: a tapped line, else the first line at the
// top of the song, else the line at the reading point.
function setCurrent(block) {
  if (block === diag.block) return;
  diag.block?.classList.remove("cur");
  block?.classList.add("cur");
  diag.block = block;
}
const isLine = el => el && !el.classList.contains("sec") && !el.classList.contains("gap");
function pausedBlock() {
  if (diag.pinned?.isConnected) return diag.pinned;
  if (window.scrollY < 40) return diag.blocks.find(b => isLine(b.el))?.el;
  const sheet = $("sheet");
  const top = sheet.getBoundingClientRect().top, line = window.innerHeight * READ_AT;
  let b = null;
  for (const x of diag.blocks) if (top + x.y <= line) b = x.el;
  return b || diag.blocks.find(x => isLine(x.el))?.el;
}
function applyPaused() {
  const sheet = $("sheet");
  if (!sheet || scroll.on) return;
  const block = pausedBlock();
  const on = diag.focus === "always";
  sheet.classList.toggle("focus", on);
  setCurrent(on ? block : null);
  showPausedRow(block);
}

// Paused: the line at the reading point gets its diagrams, each over its chord.
// Shown after pausing; follows to a new line once a paused scroll comes to rest.
function showPausedRow(block = pausedBlock()) {
  const sheet = $("sheet");
  if (!sheet) return;
  const want = diag.armed && !scroll.on && data.settings.pauseDiagrams !== false && diag.rows?.length && block;
  const old = sheet.querySelector(".prow");
  if (!want) { old?.remove(); diag.rowKey = null; return; }
  // Chord rows inside the current line (a long line may wrap onto several rows).
  const inside = diag.rows.filter(r => r.top >= block.offsetTop - 2 && r.top < block.offsetTop + block.offsetHeight);
  if (!inside.length) { old?.remove(); diag.rowKey = null; return; }
  // One set of cards above the line's first row: its chords in place, then any
  // chords that only appear where the line wraps.
  const items = inside[0].items.slice();
  for (const r of inside.slice(1)) for (const it of r.items) if (!items.some(x => x.name === it.name)) items.push(it);
  const row = { top: inside[0].top, items };
  if (old && diag.rowKey === row.top) return;
  old?.remove();
  diag.rowKey = row.top;
  const width = sheet.clientWidth, n = row.items.length, GAP = 4;
  const scale = Math.min(1, Math.max(0.7, (width + GAP) / (n * (CARD_W + GAP))));
  const w = CARD_W * scale, h = CARD_H * scale;
  // Center over each chord, push right to clear overlaps, pull back inside the edge.
  const lefts = row.items.map(it => it.x - w / 2);
  for (let i = 0; i < n; i++) lefts[i] = i === 0 ? Math.max(0, lefts[i]) : Math.max(lefts[i], lefts[i - 1] + w + GAP);
  if (lefts[n - 1] + w > width) for (let i = n - 1; i >= 0; i--) lefts[i] = Math.min(lefts[i], i === n - 1 ? width - w : lefts[i + 1] - w - GAP);
  const el = document.createElement("div");
  el.className = "prow";
  el.style.top = (row.top - h - 9) + "px";
  el.innerHTML = row.items.map((it, i) =>
    `<div class="pcard" style="left:${lefts[i].toFixed(1)}px;width:${w}px;height:${h}px">${chordSVG(it.name, scale)}<i class="dptr" style="left:${Math.min(w - 8, Math.max(8, it.x - lefts[i])).toFixed(1)}px"></i></div>`).join("");
  sheet.appendChild(el);
}
let pausedTimer = 0;
window.addEventListener("scroll", () => {
  const sheet = $("sheet");
  if (scroll.on || !sheet || route().name !== "song") return;
  if (!diag.scrolling) { diag.scrolling = true; diag.scrollFrom = window.scrollY; }
  // Focus stays on while scrolling and follows the reading point; a small
  // nudge keeps a tapped line. Diagrams move once the scroll comes to rest.
  if (diag.pinned && Math.abs(window.scrollY - diag.scrollFrom) > 40) diag.pinned = null;
  if (diag.focus === "always") { sheet.classList.add("focus"); setCurrent(pausedBlock()); }
  clearTimeout(pausedTimer);
  pausedTimer = setTimeout(() => {
    diag.scrolling = false;
    // A real scroll moves on from a tapped line; a nudge keeps it.
    if (Math.abs(window.scrollY - diag.scrollFrom) > 40) diag.pinned = null;
    applyPaused();
  }, 220);
}, { passive: true });

// "Chords in this song": each chord once, in order of first use, to learn before playing.
function renderStrip(sheet, isChords) {
  const box = $("strip");
  if (!box) return;
  const names = isChords ? [...new Set([...sheet.querySelectorAll(".c[data-ch]")].map(el => el.dataset.ch))] : [];
  box.innerHTML = names.length ? `
    <div class="strip-h"><span>Chords in this song</span><span class="n">${names.length}</span></div>
    <div class="strip" role="list">${names.map(n =>
      `<button class="scard" role="listitem" data-name="${esc(n)}" aria-label="${esc(n)}: show where it's played">${chordSVG(n)}</button>`).join("")}</div>` : "";
}

function clearSel() {
  document.querySelectorAll(".sheet .c.sel, .strip .scard.sel").forEach(el => el.classList.remove("sel"));
}

function showChordPop(target) {
  const sheet = $("sheet");
  sheet.querySelectorAll(".dpop").forEach(el => el.remove());
  clearSel();
  if (!target) return;
  document.querySelectorAll(".strip .scard").forEach(c => c.classList.toggle("sel", c.dataset.name === target.dataset.ch));
  const box = sheet.getBoundingClientRect(), r = target.getBoundingClientRect();
  const s = 1.45, w = CARD_W * s, h = CARD_H * s;
  const cx = r.left - box.left + Math.min(r.width, 40) / 2;
  const left = Math.max(0, Math.min(sheet.clientWidth - w, cx - w / 2));
  const pop = document.createElement("div");
  pop.className = "dpop";
  pop.style.cssText = `left:${left}px;top:${r.top - box.top - h - 10}px;width:${w}px;height:${h}px`;
  pop.innerHTML = chordSVG(target.dataset.ch, s) + `<i class="dptr" style="left:${Math.min(w - 10, Math.max(10, cx - left))}px"></i>`;
  sheet.appendChild(pop);
  target.classList.add("sel");
}
document.addEventListener("click", e => {
  if (route().name !== "song" || !$("sheet")) return;
  // Strip card: outline it and mark every place that chord is played.
  const sc = e.target instanceof Element && e.target.closest(".strip .scard");
  if (sc) {
    const on = !sc.classList.contains("sel");
    showChordPop(null);
    if (on) {
      sc.classList.add("sel");
      document.querySelectorAll(".sheet .c[data-ch]").forEach(c => c.classList.toggle("sel", c.dataset.ch === sc.dataset.name));
    }
    return;
  }
  const chord = e.target instanceof Element && e.target.closest(".sheet .c[data-ch]");
  if (chord && !scroll.on) {
    const same = chord.classList.contains("sel");
    showChordPop(same ? null : chord);
    return;
  }
  if (!(e.target instanceof Element && e.target.closest(".dpop"))) showChordPop(null);
  // Tap a line while paused: it becomes the current line, and play starts from it.
  const block = e.target instanceof Element && e.target.closest(".sheet > *");
  if (block && !scroll.on && isLine(block) && !block.classList.contains("prow") && !block.classList.contains("dpop") && diag.focus === "always") {
    diag.pinned = block;
    diag.armed = true;
    applyPaused();
  }
});

let resizeTimer = 0;
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { if (redraw && route().name === "song" && $("sheet")) redraw(); }, 120);
});

// Manual scrolling while auto-scroll plays: hold the auto-scroll while the finger
// (or momentum, or a wheel) is moving, then carry on from wherever the reader left it.
const hold = { active: false, touching: false, timer: 0 };
function releaseSoon(ms) {
  clearTimeout(hold.timer);
  hold.timer = setTimeout(() => { if (!hold.touching) hold.active = false; }, ms);
}
window.addEventListener("touchstart", e => {
  if (e.target instanceof Element && e.target.closest(".dock")) return;
  hold.touching = true; hold.active = true; clearTimeout(hold.timer);
}, { passive: true });
window.addEventListener("touchend", () => { hold.touching = false; releaseSoon(180); }, { passive: true });
window.addEventListener("touchcancel", () => { hold.touching = false; releaseSoon(180); }, { passive: true });
window.addEventListener("wheel", () => { hold.active = true; releaseSoon(250); }, { passive: true });

// Compact header fade: scrolling up reveals it gradually, scrolling down hides it.
// Near the top the full header is in view, so the compact one hands back to it.
const fab = { lastY: 0, reveal: 1 };
function updateHeader(d) {
  const bar = $("chead");
  if (!bar) return;
  const y = window.scrollY;
  const meta = $("meta");
  const handoff = meta ? meta.offsetTop + meta.offsetHeight - 56 : 120; // full header gone above this
  if (y < 60) fab.reveal = 1;
  else if (d < 0) fab.reveal = Math.min(1, fab.reveal - d / 140);
  else if (d > 0) fab.reveal = Math.max(0, fab.reveal - d / 60);
  const past = Math.min(1, Math.max(0, (y - handoff) / 40)); // soft cross-fade at the handoff
  const op = fab.reveal * past;
  bar.style.opacity = op.toFixed(3);
  const live = op > 0.15;
  bar.style.pointerEvents = live ? "auto" : "none";
  bar.setAttribute("aria-hidden", live ? "false" : "true");
  bar.querySelectorAll("button").forEach(b => b.tabIndex = live ? 0 : -1);
}
window.addEventListener("scroll", () => {
  const y = window.scrollY;
  const d = y - fab.lastY;
  fab.lastY = y;
  if (hold.active && !hold.touching) releaseSoon(180); // momentum still moving
  updateHeader(d);
  updateDiagrams();
}, { passive: true });

async function startScroll(song) {
  scroll.on = true; scroll.last = 0; scroll.carry = 0; scroll.bottomSince = 0;
  showChordPop(null);
  $("sheet")?.querySelectorAll(".prow").forEach(el => el.remove());
  diag.rowKey = null;
  if (diag.pinned?.isConnected) {
    // Glide the tapped line to the reading point, then carry on from there.
    const target = window.scrollY + diag.pinned.getBoundingClientRect().top - window.innerHeight * READ_AT;
    hold.active = true; releaseSoon(800);
    window.scrollTo({ top: Math.max(0, target), behavior: "smooth" });
  }
  diag.pinned = null; diag.scrolling = false;
  updateDiagrams();
  const btn = $("play");
  btn.innerHTML = icon("pause");
  btn.setAttribute("aria-label", "Pause auto-scroll");
  try { scroll.lock = await navigator.wakeLock?.request("screen"); } catch {}
  const tick = t => {
    if (!scroll.on) return;
    if (scroll.last && !hold.active) {
      scroll.carry += (t - scroll.last) / 1000 * song.speed * 0.6;
      const px = Math.floor(scroll.carry);
      if (px) { window.scrollBy(0, px); scroll.carry -= px; }
      // At the end: wait a few seconds (the reader may scroll back up), then stop.
      if (window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 2) {
        scroll.bottomSince ||= t;
        if (t - scroll.bottomSince > 4000) return stopScroll();
      } else scroll.bottomSince = 0;
    }
    scroll.last = t;
    scroll.raf = requestAnimationFrame(tick);
  };
  scroll.raf = requestAnimationFrame(tick);
}

function stopScroll() {
  scroll.on = false;
  cancelAnimationFrame(scroll.raf);
  scroll.lock?.release?.().catch(() => {});
  scroll.lock = null;
  const btn = $("play");
  if (btn) { btn.innerHTML = icon("play"); btn.setAttribute("aria-label", "Start auto-scroll"); }
  updateDiagrams();
  if (btn) { diag.armed = true; showPausedRow(); }
}

// ---------- Add / Edit sheet ----------
const PLACEHOLDER = {
  chords: "Paste or type chords and lyrics\n\n[Verse]\nG              C        G\nWalking down the river road tonight\n\nor inline:  [G]Walking [C]down",
  tab: "Paste ASCII tab\n\ne|-----0-----0-----|\nB|-----1-----1-----|\nG|-----0-----0-----|\nD|-----2-----2-----|"
};

function renderForm(id) {
  const song = id ? data.songs.find(s => s.id === id) : null;
  if (id && !song) return go("#/");
  const src = song || draft || {};
  let format = src.format || "chords";
  // Library stays underneath so the sheet reads as a layer.
  if (!app.innerHTML.trim()) renderLibrary();
  layer.innerHTML = `
    <div class="scrim"></div>
    <div class="panel full" role="dialog" aria-label="${song ? "Edit song" : "New song"}">
      <div class="grab"></div>

      <div class="pbody">
        <div class="fields glass">
          <label class="fld"><span class="lab">Title</span><input id="f-title" value="${esc(src.title)}" placeholder="Song title" autocomplete="off"></label>

          <div class="fld">
            <span class="lab">Format</span>

              <button data-fmt="chords" class="${format === "chords" ? "on" : ""}">Chords</button>

            </div>
            <label id="keywrap" style="display:${format === "tab" ? "none" : "flex"};align-items:center;gap:8px">
              <span style="font-size:15px;color:var(--muted)">Key</span>
              <input id="f-key" value="${esc(src.key)}" placeholder="Auto" maxlength="4" autocomplete="off" autocapitalize="characters" style="width:48px;text-align:right">
            </label>
          </div>
        </div>
        <textarea class="body glass" id="f-body" spellcheck="false" autocapitalize="off" autocorrect="off" aria-label="Song content" placeholder="${esc(PLACEHOLDER[format])}">${esc(src.body)}</textarea>
        <div class="detect" id="detect"></div>
        ${song ? '<button class="danger" id="delete">Delete Song</button>' : ""}
      </div>
    </div>`;

  const detectLine = () => {
    const body = $("f-body").value;
    if (!body.trim() || format === "tab") { $("detect").innerHTML = ""; return; }
    const k = $("f-key").value.trim() || guessKey(body);
    const secs = parseSheet(body).filter(l => l.kind === "section").length;
    $("detect").innerHTML = k ? `${icon("check")}<span>Chord sheet in ${esc(k)}${secs ? `, ${secs} section${secs === 1 ? "" : "s"}` : ""}</span>` : "";
  };
  detectLine();
  $("f-body").oninput = detectLine;
  $("f-key").oninput = detectLine;

  layer.querySelectorAll("[data-fmt]").forEach(b => b.onclick = () => {
    format = b.dataset.fmt;
    layer.querySelectorAll("[data-fmt]").forEach(x => x.classList.toggle("on", x === b));
    $("keywrap").style.display = format === "tab" ? "none" : "flex";
    $("f-body").placeholder = PLACEHOLDER[format];
    detectLine();
  });

  const close = () => { draft = null; history.length > 1 ? history.back() : go(song ? "#/song/" + encodeURIComponent(song.id) : "#/"); };
  $("cancel").onclick = close;
  layer.querySelector(".scrim").onclick = close;
  $("save").onclick = () => {
    const title = $("f-title").value.trim();
    if (!title) { toast("Add a title first"); $("f-title").focus(); return; }
    const raw = $("f-key").value.trim();
    const fields = {
      title,
      artist: $("f-artist").value.trim(),
      format,
      key: format === "chords" && raw ? raw[0].toUpperCase() + raw.slice(1) : "",
      body: $("f-body").value
    };
    draft = null;
    if (song) {
      Tabs.updateSong(data, song.id, fields);
      history.replaceState(null, "", "#/");
      go("#/song/" + encodeURIComponent(song.id));
    } else {
      const s = Tabs.addSong(data, fields);
      history.replaceState(null, "", "#/");
      go("#/song/" + encodeURIComponent(s.id));
    }
    toast("Saved");
  };
  $("delete")?.addEventListener("click", () => {
    if (!confirm(`Delete "${song.title}"?`)) return;
    Tabs.deleteSong(data, song.id);
    history.replaceState(null, "", "#/");
    layer.innerHTML = "";
    render();
    toast("Deleted");
  });
  if (!src.title) setTimeout(() => $("f-title")?.focus(), 300);
}

    <p class="foot">${data.songs.length} song${data.songs.length === 1 ? "" : "s"}, stored only on this device. Add Tabs to your Home Screen from the Share menu to use it offline.</p>`;
  $("back").onclick = () => go("#/");
  $("s-transpose").onchange = e => { s.transpose = +e.target.value; Tabs.save(data); renderSettings(); };
  $("s-diagrams").onclick = () => { s.diagrams = s.diagrams !== true; Tabs.save(data); renderSettings(); };
  $("s-pause").onclick = () => { s.pauseDiagrams = s.pauseDiagrams === false; Tabs.save(data); renderSettings(); };
  $("s-focus").onchange = e => { s.focus = e.target.value; Tabs.save(data); renderSettings(); };
  $("s-theme").onclick = () => { s.theme = s.theme === "light" ? "dark" : "light"; Tabs.save(data); applyTheme(); renderSettings(); };
  $("s-export").onclick = async () => {
    const name = `tabs-backup-${new Date().toISOString().slice(0, 10)}.json`;
    const file = new File([Tabs.export(data)], name, { type: "application/json" });
    if (navigator.canShare?.({ files: [file] })) {
      try { await navigator.share({ files: [file], title: "Tabs backup" }); return; } catch (e) { if (e.name === "AbortError") return; }
    }
    const a = document.createElement("a");
    a.href = URL.createObjectURL(file);
    a.download = name;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  };
  $("s-import").onclick = () => $("file").click();
  $("file").onchange = e => {
    const f = e.target.files[0];
    if (!f) return;
    const reader = new FileReader();
    reader.onload = () => {
      const imported = Tabs.import(reader.result);
      if (!imported) return toast("That file isn't a Tabs backup");
      data = imported;
      applyTheme();
      toast(`Imported ${data.songs.length} song${data.songs.length === 1 ? "" : "s"}`);
      go("#/");
    };
    reader.readAsText(f);
  };
}

// ---------- Router ----------
function render() {
  stopScroll();
  app.classList.remove("viewer");
  const r = route();
  if (r.name !== "add" && r.name !== "edit") layer.innerHTML = "";
  if (r.name === "song") renderViewer(r.id);
  else if (r.name === "add") renderForm();
  else if (r.name === "edit") { const s = data.songs.find(x => x.id === r.id); if (s && !app.querySelector("#sheet")) renderViewer(r.id); renderForm(r.id); }
  else if (r.name === "settings") { renderSettings(); window.scrollTo(0, 0); }
  else { renderLibrary(); }
}

window.addEventListener("hashchange", render);
applyTheme();
render();

if ("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js");
</script>
</body>
</html>
