<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#0c0d0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tabs">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Tabs</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root {
  --bg: #0c0d0f;
  --bg-glow: rgba(255,255,255,0.05);
  --fg: #f3f1ee;
  --fg-2: #c9c7c3;
  --muted: #8f8e8c;
  --accent: #eda27f;
  --accent-deep: #c97a57;
  --on-accent: #1a120d;
  --accent-soft: rgba(237,162,127,0.13);
  --accent-line: rgba(237,162,127,0.4);
  --card: rgba(255,255,255,0.035);
  --card-2: rgba(255,255,255,0.07);
  --rim: rgba(255,255,255,0.09);
  --hair: rgba(255,255,255,0.07);
  --rim-hi: rgba(255,255,255,0.12);
  --bar: rgba(38,39,42,0.86);
  --solid: #1b1c1f;
  --scrim: rgba(4,4,5,0.6);
  --shadow: 0 8px 24px rgba(0,0,0,0.4);
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif;
  --serif: "New York", ui-serif, "Iowan Old Style", Charter, Georgia, serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Roboto Mono", monospace;
  --r: 12px;
  --r-bar: 14px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #f3f0eb;
  --bg-glow: rgba(255,255,255,0.8);
  --fg: #1d1c1a;
  --fg-2: #3b3936;
  --muted: #76736e;
  --accent: #c46f48;
  --accent-deep: #a95a37;
  --on-accent: #fff8f3;
  --accent-soft: rgba(196,111,72,0.1);
  --accent-line: rgba(196,111,72,0.4);
  --card: rgba(255,255,255,0.6);
  --card-2: rgba(255,255,255,0.92);
  --rim: rgba(0,0,0,0.08);
  --hair: rgba(0,0,0,0.07);
  --rim-hi: rgba(255,255,255,0.9);
  --bar: rgba(255,255,255,0.86);
  --solid: #fbf9f6;
  --scrim: rgba(40,30,20,0.28);
  --shadow: 0 8px 24px rgba(60,40,20,0.12);
  color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { background: var(--bg); }
body {
  margin: 0; min-height: 100dvh; color: var(--fg); font-family: var(--sans); font-size: 16px;
  background: radial-gradient(120% 50% at 50% -10%, var(--bg-glow), transparent 60%), var(--bg);
  background-attachment: fixed; -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
input, textarea { outline: none; }
::placeholder { color: var(--muted); }
svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }

.app { max-width: 520px; margin: 0 auto; padding: calc(18px + var(--safe-t)) 20px calc(110px + var(--safe-b)); }

/* Surfaces */
.glass {
  background: linear-gradient(180deg, var(--card-2), var(--card));
  border: 1px solid var(--rim);
  box-shadow: inset 0 1px 0 var(--rim-hi);
}
.float { box-shadow: inset 0 1px 0 var(--rim-hi), var(--shadow); -webkit-backdrop-filter: blur(22px) saturate(150%); backdrop-filter: blur(22px) saturate(150%); background: var(--bar); }

/* Header */
.head { display: flex; align-items: center; justify-content: space-between; min-height: 44px; margin-bottom: 4px; }
.title { font-family: var(--serif); font-weight: 400; font-size: 40px; letter-spacing: -0.01em; line-height: 1.1; margin: 0; }
.ib { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; padding: 0; color: var(--fg-2); flex: none; position: relative; }
.ib::after { content: ""; position: absolute; inset: -4px; }
.ib.on { color: var(--accent); }
.ib.on svg { fill: var(--accent); }
.row-btns { display: flex; align-items: center; gap: 10px; }
/* Song view back button floats; it fades out scrolling down and back in scrolling up */
/* Compact song header: fades out scrolling down, fades in scrolling up */
.chead { position: fixed; z-index: 25; left: 0; right: 0; top: 0; padding-top: calc(10px + var(--safe-t)); opacity: 0; pointer-events: none; transition: opacity .12s linear; }
.chead::before { content: ""; position: absolute; inset: 0 0 -18px; background: var(--bar); -webkit-backdrop-filter: blur(22px) saturate(150%); backdrop-filter: blur(22px) saturate(150%);
  -webkit-mask-image: linear-gradient(180deg, #000 calc(100% - 26px), transparent); mask-image: linear-gradient(180deg, #000 calc(100% - 26px), transparent); }
.chead .in { position: relative; max-width: 520px; margin: 0 auto; padding: 0 20px 8px; display: flex; align-items: center; gap: 12px; height: 56px; }
.chead .ctitle { flex: 1; min-width: 0; border: 0; background: none; padding: 4px 0; text-align: left; color: var(--fg); }
.chead .ct { font-family: var(--serif); font-size: 17px; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chead .cs { font-size: 12.5px; color: var(--muted); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chead .cs b { color: var(--fg-2); font-weight: 500; }

/* Chips */
.chips { display: flex; gap: 8px; margin: 14px 0 0; }
.chip { height: 28px; padding: 0 12px; border-radius: 14px; font-size: 13px; border: 1px solid var(--rim); background: var(--card); color: var(--muted); }
.chip.on { color: var(--accent); border-color: var(--accent-line); background: var(--accent-soft); }

/* Sections and lists */
.label { font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin: 22px 4px 8px; }
.label.lrow { display: flex; align-items: center; justify-content: space-between; }
.sortby { position: relative; display: inline-flex; align-items: center; gap: 3px; text-transform: none; letter-spacing: 0; font-size: 13px; font-weight: 500; color: var(--fg-2); }
.sortby .chev { width: 13px; height: 13px; transform: rotate(90deg); opacity: .7; }
.sortby select { position: absolute; inset: 0; opacity: 0; font-size: 16px; }
.row .hit { font-style: italic; }
.row .hit mark { background: none; color: var(--accent); font-style: normal; }
.list { border-radius: 16px; overflow: hidden; }
.row { display: flex; align-items: center; gap: 10px; width: 100%; height: 60px; padding: 0 16px; border: 0; border-bottom: 1px solid var(--hair); background: none; text-align: left; color: var(--fg); }
.row:last-child { border-bottom: 0; }
.row:active { background: var(--card-2); }
.row .txt { flex: 1; min-width: 0; }
.row .t { font-size: 16px; font-weight: 500; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .a { font-size: 13.5px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .k { font: 500 13px var(--mono); color: var(--muted); min-width: 30px; text-align: right; }
.heart { width: 14px; height: 14px; fill: var(--accent); flex: none; }
.recent { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.rc { border-radius: 14px; padding: 12px 14px; text-align: left; color: var(--fg); min-width: 0; }
.rc .t { font-size: 15px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rc .a { font-size: 12.5px; color: var(--muted); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.empty { color: var(--muted); text-align: center; padding: 56px 24px; line-height: 1.6; font-size: 15px; }

/* Bottom bars */
.dock { position: fixed; left: 50%; bottom: calc(14px + var(--safe-b)); width: min(496px, calc(100% - 24px)); transform: translateX(-50%); z-index: 20; display: flex; gap: 10px; transition: transform .15s; }
.dock-fade { position: fixed; left: 0; right: 0; bottom: 0; height: calc(110px + var(--safe-b)); background: linear-gradient(180deg, transparent, var(--bg) 70%); pointer-events: none; z-index: 10; }
.cmd { flex: 1; min-width: 0; height: 52px; border-radius: var(--r-bar); display: flex; align-items: center; gap: 10px; padding: 0 8px 0 16px; }
.cmd svg { color: var(--accent); }
.cmd input { flex: 1; min-width: 0; border: 0; background: none; font-size: 16px; height: 100%; }
.cmd .clear[hidden] { display: none; }
.cmd .clear { width: 32px; height: 32px; border: 0; background: none; color: var(--muted); display: grid; place-items: center; padding: 0; }
.add { width: 52px; height: 52px; border-radius: var(--r-bar); border: 0; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; flex: none; box-shadow: 0 6px 18px color-mix(in srgb, var(--accent) 30%, transparent); }
.add svg { width: 20px; height: 20px; stroke-width: 2.2; }

/* Song view */
.song-title { font-family: var(--serif); font-weight: 400; font-size: 36px; letter-spacing: -0.01em; line-height: 1.1; margin: 18px 0 6px; overflow-wrap: anywhere; }
.metarow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; }
.metarow .meta { margin-bottom: 0; }
.stat { border: 1px solid var(--rim); background: var(--card); color: var(--muted); font-size: 12.5px; height: 26px; padding: 0 10px; border-radius: 13px; display: inline-flex; align-items: center; gap: 6px; }
.stat.learning { color: var(--accent); border-color: var(--accent-line); background: var(--accent-soft); }
.stat.got { color: #7ac47f; border-color: rgba(122,196,127,0.4); background: rgba(122,196,127,0.1); }
.stat .pl { color: var(--muted); }
.row .a .st.learning { color: var(--accent); }
.row .a .st.got { color: #7ac47f; }
.weekly { font-size: 13px; color: var(--muted); margin: 2px 4px 0; }
.meta { color: var(--muted); font-size: 14px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }
.meta .dot { width: 4px; height: 4px; border-radius: 50%; background: var(--accent); }
.meta b { color: var(--fg-2); font-weight: 500; }
.sheet { font-size: var(--lyric-size, 17px); line-height: 1.45; overflow-wrap: anywhere; }
.sheet .sec { font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin: 18px 0 4px; }
.sheet .sec:first-child { margin-top: 4px; }
.sheet .gap { height: 0.7em; }
.sheet .ly { margin: 0 0 0.5em; }
/* Chord-over-word blocks: each word stays whole; lines wrap between words */
.sheet .pr { margin: 0 0 0.55em; }
.sheet .w { white-space: nowrap; }
.sheet .sg { display: inline-block; vertical-align: baseline; }
.sheet .sg > .c { display: block; line-height: 1.25; padding-right: 0.45em; min-height: 1.25em; }
.sheet .sg > .l { white-space: pre; }
.sheet .sg.free > .c { width: 0; overflow: visible; white-space: nowrap; padding-right: 0; }
.sheet { overflow-x: clip; position: relative; }
.sheet .c[data-ch] { cursor: pointer; position: relative; }
.sheet .c[data-ch]::after { content: ""; position: absolute; inset: -6px -4px; }
.sheet .c.sel .ct { background: var(--accent-soft); border-radius: 4px; box-shadow: 0 0 0 3px var(--accent-soft), 0 0 0 4px var(--accent-line); }
/* Chord diagram cards */
.prow { position: absolute; left: 0; right: 0; height: 0; z-index: 5; pointer-events: none; animation: fade .25s ease-out; }
.pcard, .dpop { position: absolute; top: 0; box-sizing: border-box; border-radius: 10px; background: var(--solid); border: 1px solid var(--rim); box-shadow: 0 6px 18px rgba(0,0,0,0.4); display: grid; place-items: center; }
.dpop { z-index: 6; animation: pop .16s ease-out; }
@keyframes pop { from { opacity: 0; transform: translateY(4px) scale(.96); } }
.dptr { position: absolute; bottom: -5px; width: 8px; height: 8px; margin-left: -4px; transform: rotate(45deg); background: var(--solid); border-right: 1px solid var(--rim); border-bottom: 1px solid var(--rim); }
.pcard svg, .dpop svg { display: block; }
.dn { font: 600 10.5px var(--sans); fill: var(--fg); }
.dx { stroke: var(--muted); stroke-width: 1.1; stroke-linecap: round; fill: none; }
.do { fill: none; stroke: var(--fg-2); stroke-width: 1; }
.dnut { fill: var(--fg); }
.df { stroke: var(--fg); stroke-opacity: .38; stroke-width: .8; }
.ds { stroke: var(--fg); stroke-opacity: .55; stroke-width: .8; }
.dd { fill: var(--accent); }
.dk { font: 700 5.4px var(--sans); fill: var(--on-accent); }
.db { font: 7px var(--sans); fill: var(--muted); }
.sheet .c { color: var(--accent); font-weight: 650; font-size: 0.88em; letter-spacing: 0.01em; }
.sheet .crow { display: flex; flex-wrap: wrap; column-gap: 1.1em; row-gap: 0.2em; margin: 0 0 0.55em; }
/* Tabs: all strings wrap together, a measure at a time */
.sheet .tab { font-family: var(--mono); font-size: var(--tab-size, 14px); line-height: 1.35; white-space: pre; margin: 0 0 1em; color: var(--fg); }
.sheet .tab + .tab { margin-top: -0.2em; }
.pw { flex: 1; min-width: 0; border-radius: var(--r-bar); overflow: hidden; }
.player { height: 56px; display: flex; align-items: center; gap: 12px; padding: 0 8px; }
/* Now and Next: a fixed panel in the dock while playing; only its contents change */
.nn { display: none; align-items: flex-end; gap: 14px; padding: 12px 14px; border-bottom: 1px solid var(--hair); }
body.nn-on .nn { display: flex; animation: nnin .2s ease-out; }
@keyframes nnin { from { opacity: 0; } }
.nn .lab { font-size: 10px; font-weight: 600; letter-spacing: 0.14em; color: var(--muted); margin: 0 0 6px 2px; }
.nn .nowcol .lab { color: var(--accent); }
.nn .vs { width: 1px; align-self: stretch; background: var(--rim); }
.nn .cards { display: flex; gap: 8px; align-items: flex-end; min-width: 0; overflow: hidden; }
.nn .card { flex: none; border-radius: 10px; background: var(--solid); border: 1px solid var(--rim); display: grid; place-items: center; box-sizing: border-box; }
.nn .card svg { display: block; }
.nn .swap { animation: swap .16s ease-out; }
@keyframes swap { from { opacity: .3; } }
/* Chords in this song */
.strip-h { display: flex; justify-content: space-between; align-items: baseline; margin: 0 2px 8px; font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.strip-h .n { font-weight: 500; letter-spacing: 0; }
.strip { display: flex; gap: 8px; overflow-x: auto; margin: 0 -20px 10px; padding: 2px 20px 8px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
.strip::-webkit-scrollbar { display: none; }
.scard { flex: none; width: 54px; height: 78px; padding: 0; border-radius: 10px; background: var(--solid); border: 1px solid var(--rim); display: grid; place-items: center; }
.scard svg { display: block; }
.scard.sel { border-color: transparent; box-shadow: 0 0 0 1.5px var(--accent); }
/* AI help */
.spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; display: inline-block; animation: rot .7s linear infinite; flex: none; }
@keyframes rot { to { transform: rotate(360deg); } }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.btn svg { width: 16px; height: 16px; }
.btn:disabled { opacity: .6; }
.btn.sm { flex: none; height: 34px; padding: 0 12px; font-size: 14px; border-radius: 10px; }
.btn.sm.primary { flex: none; }
.ai-row { display: flex; gap: 8px; margin: 0 0 10px; }
.chip.ai { display: inline-flex; align-items: center; gap: 6px; height: 32px; color: var(--accent); border-color: var(--accent-line); background: var(--accent-soft); }
.chip.ai svg { width: 15px; height: 15px; }
.chip.ai:disabled { opacity: .55; }
.ai-note { font-size: 13px; color: #e07a6c; margin: -4px 2px 10px; line-height: 1.4; }
.detect .err { color: #e07a6c; }
.detect .sep { color: var(--muted); }
.link { border: 0; background: none; color: var(--accent); font-size: 13px; padding: 4px 2px; text-decoration: underline; }
.seg.mini { flex: none; height: 28px; padding: 2px; border-radius: 8px; }
.seg.mini button { height: 24px; padding: 0 8px; font-size: 12px; border-radius: 6px; }
.key-row { display: flex; align-items: center; gap: 8px; padding: 10px 14px 12px; border-top: 1px solid var(--hair); }
.ai-status { flex: 1; display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); }
.ai-status .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--rim); }
.ai-status .dot.on { background: #7ac47f; }
/* Make it easier */
.strip-h .chip.easy { text-transform: none; letter-spacing: 0; font-weight: 500; height: 28px; font-size: 12.5px; }
.chip.easy.off { color: var(--muted); border-color: var(--rim); background: var(--card); }
.easy-wait { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 14px; padding: 18px 2px 22px; }
.easy-note { font-size: 14px; color: var(--fg-2); line-height: 1.45; margin: 0 2px 12px; }
.elabel { font-size: 10px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); margin: 0 2px 6px; }
.erow { display: flex; gap: 6px; overflow-x: auto; margin: 0 -16px 12px; padding: 0 16px 2px; scrollbar-width: none; }
.erow::-webkit-scrollbar { display: none; }
.ecard { flex: none; border-radius: 9px; background: var(--card); border: 1px solid var(--rim); padding: 1px; }
.ecard svg { display: block; }
/* Backup banner */
.bk { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; border-radius: 14px; padding: 12px 14px; margin: 16px 0 0; }
.bk .tile { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); flex: none; }
.bk .tile svg { width: 17px; height: 17px; }
.bk-t { flex: 1; min-width: 160px; display: flex; flex-direction: column; gap: 2px; font-size: 13px; color: var(--muted); }
.bk-t b { font-size: 15px; font-weight: 600; color: var(--fg); }
.bk-b { display: flex; gap: 8px; margin-left: auto; }
.set .val.muted { color: var(--muted); }
.ib.aa { font-size: 13px; font-weight: 600; letter-spacing: -0.02em; color: var(--fg-2); }
.szpop { position: fixed; z-index: 30; display: flex; align-items: center; gap: 8px; padding: 6px; border-radius: 12px; }
.szpop .v { font: 600 13px var(--mono); min-width: 46px; text-align: center; color: var(--fg); }
.countin { position: fixed; left: 50%; transform: translateX(-50%); z-index: 15; width: 120px; height: 120px; border-radius: 50%; display: grid; place-items: center;
  font: 300 64px var(--serif); color: var(--accent); background: color-mix(in srgb, var(--bg) 70%, transparent); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); pointer-events: none; }
.countin.pulse { animation: beat .35s ease-out; }
@keyframes beat { from { transform: translateX(-50%) scale(1.12); opacity: .6; } }
/* Sets */
.row.newset .t { color: var(--accent); display: flex; align-items: center; gap: 8px; }
.row.newset svg { width: 16px; height: 16px; }
.row .chev { color: var(--muted); width: 16px; height: 16px; }
.settitle { border: 0; background: none; padding: 0; text-align: left; color: var(--fg); display: block; margin: 14px 2px 0; }
.cta svg { width: 18px; height: 18px; fill: currentColor; stroke: none; }
.cta { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; }
.setrow { gap: 8px; }
.setrow .num { font: 500 13px var(--mono); color: var(--muted); width: 18px; text-align: right; }
.setrow .open { border: 0; background: none; padding: 0; text-align: left; color: inherit; flex: 1; min-width: 0; }
.setrow .sb:disabled { opacity: .3; }
.row.pick .check { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--rim); display: grid; place-items: center; color: var(--on-accent); flex: none; }
.row.pick.on .check { background: var(--accent); border-color: var(--accent); }
.row.pick:disabled { opacity: .55; }
.row.pick:disabled .check { background: var(--card-2); color: var(--muted); }
.row.pick .check svg { width: 13px; height: 13px; stroke-width: 2.4; }
.setbar { display: flex; align-items: center; gap: 8px; margin: 14px 0 -8px; }
.setbar .setname { flex: 1; min-width: 0; border: 0; background: none; color: var(--accent); font-size: 13px; font-weight: 600; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.setbar .sb:disabled { opacity: .3; }
.nextup { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(84px + var(--safe-b)); z-index: 22; width: min(496px, calc(100% - 24px)); border-radius: 14px; padding: 12px 12px 12px 16px; display: flex; align-items: center; gap: 8px; animation: fade .25s; }
.nu-t { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; font-size: 13px; color: var(--muted); }
.nu-t .lab { font-size: 10px; font-weight: 600; letter-spacing: 0.14em; color: var(--accent); }
.nu-t b { font-size: 16px; font-weight: 500; color: var(--fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* Spark tone */
.tonebtn { gap: 5px; }
.tonebtn svg { width: 14px; height: 14px; }
.panel.tone { max-height: calc(100dvh - 40px); overflow-y: auto; }

/* First-time guide */
.tipwrap { position: fixed; inset: 0; z-index: 70; }
.tipring { position: fixed; border-radius: 12px; box-shadow: 0 0 0 2px var(--accent), 0 0 0 9999px rgba(0,0,0,0.6); transition: all .25s ease; pointer-events: none; }
.tipcard { position: fixed; left: 50%; transform: translateX(-50%); width: min(360px, calc(100% - 32px)); border-radius: 16px; padding: 14px 14px 10px 16px; background: var(--solid); }

/* Song menu */
.menu { position: fixed; z-index: 35; width: 272px; border-radius: 16px; padding: 6px; background: var(--solid); animation: pop .14s ease-out; }
.mrow { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 44px; padding: 0 10px; border: 0; background: none; border-radius: 10px; color: var(--fg); font-size: 15px; text-align: left; }
button.mrow:active { background: var(--card-2); }
.mrow .mi { width: 20px; color: var(--fg-2); display: grid; place-items: center; }
.mrow .mi svg { width: 18px; height: 18px; }
.mrow .ml { flex: 1; white-space: nowrap; }
.mrow .mh { font-size: 12.5px; color: var(--accent); }

.mrow.size .v { font: 600 13px var(--mono); min-width: 40px; text-align: center; }
/* Screen transitions */
::view-transition-old(root), ::view-transition-new(root) { animation-duration: .22s; animation-timing-function: ease-out; }
::view-transition-group(song-title) { animation-duration: .32s; animation-timing-function: cubic-bezier(.2,.8,.2,1); }
::view-transition-old(song-title), ::view-transition-new(song-title) { height: 100%; width: auto; }
@media (prefers-reduced-motion: reduce) { *, ::view-transition-group(*) { animation-duration: 0s !important; transition-duration: 0s !important; } }
.panel.card { animation: up .36s cubic-bezier(.2,1.15,.3,1) !important; }
/* Practice a section */
.loopbanner { position: fixed; left: 50%; transform: translateX(-50%); top: calc(12px + var(--safe-t)); z-index: 40; width: min(480px, calc(100% - 24px)); border-radius: 14px; padding: 10px 8px 10px 14px; display: flex; align-items: center; gap: 10px; background: var(--solid); font-size: 14px; animation: fade .2s; }
.loopbanner span { flex: 1; }
.sheet > .inloop { position: relative; padding-left: 12px; }
.sheet > .inloop::before { content: ""; position: absolute; left: 0; top: 0; bottom: -0.55em; width: 2px; background: var(--accent); opacity: .55; }
.sheet > .loopfirst::before { top: 4px; border-radius: 2px 2px 0 0; }
.sheet > .looplast::before { bottom: 2px; border-radius: 0 0 2px 2px; }
.sheet > .loopa { background: var(--accent-soft); border-radius: 6px; }
.looprow { display: none; align-items: center; gap: 8px; padding: 8px 8px 8px 12px; border-bottom: 1px solid var(--hair); font-size: 13px; color: var(--muted); }

.imp-t { margin: 0 2px 14px; font-size: 15px; }
.linkbtn { background: none; border: 0; padding: 0; font: inherit; color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }
.imp-list { margin-bottom: 12px; max-height: 40vh; overflow-y: auto; }
.looprow > svg { width: 16px; height: 16px; color: var(--accent); flex: none; }
.looprow .lt { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.looprow .lt b { color: var(--fg); font-weight: 500; }
.looprow .chip { height: 26px; font-size: 12px; padding: 0 10px; }
body.loop-on .app.viewer { padding-bottom: calc(160px + var(--safe-b)); }
.nn .none { color: var(--muted); font-size: 13px; padding: 0 2px 6px; }
body.nn-on .app.viewer { padding-bottom: calc(250px + var(--safe-b)); }
/* Current line focus while playing: other lines dim in place (no motion) */
.sheet > * { transition: opacity .3s, transform .2s ease-out; }
/* Focus current line: heavier and 5% larger without changing how it wraps.
   The stroke thickens the letters without widening them, and the scale is a
   transform, so nothing below moves. Lines keep 5% spare width on the right
   so a scaled line never runs off the edge. */
.sheet > .pr, .sheet > .ly { margin-right: 5%; }
.sheet.focus > .cur:is(.pr, .ly) { transform: scale(1.05); transform-origin: left center; -webkit-text-stroke: 0.95px currentColor; }
.sheet.focus > .cur .c { -webkit-text-stroke: 0; }
@media (prefers-reduced-motion: reduce) { .sheet > * { transition: opacity .3s; } }
.sheet.focus > *:not(.cur):not(.prow):not(.dpop) { opacity: .38; }
.sheet .c.now .ct { box-shadow: inset 0 -2px 0 var(--accent); }
/* While playing, the top of the song (header, title, chord strip) goes quiet */
.app.viewer > .head, .app.viewer > .song-title, .app.viewer > .meta, .app.viewer > #strip { transition: opacity .3s, filter .3s; }
body.playing .app.viewer > .head, body.playing .app.viewer > .song-title,
body.playing .app.viewer > .meta, body.playing .app.viewer > #strip { opacity: .35; transition: opacity .5s, filter .5s; }
body.playing .app.viewer > #strip { filter: grayscale(1); }
/* Player controls fade after a few idle seconds while playing; play/pause stays */
.player .speed, .player .vsep, .player .step, .player .nnbtn { transition: opacity .3s; }
.player.idle .speed, .player.idle .vsep, .player.idle .step, .player.idle .nnbtn { opacity: .4; transition: opacity .6s; }
.play { width: 40px; height: 40px; border-radius: 10px; border: 0; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; flex: none; padding: 0; }

.speed { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; }

.step { display: flex; align-items: center; gap: 4px; }
.sb { width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--rim); background: var(--card); color: var(--fg-2); display: grid; place-items: center; padding: 0; }

input[type=range] { -webkit-appearance: none; appearance: none; flex: 1; min-width: 0; height: 28px; background: none; margin: 0; }
input[type=range]::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: linear-gradient(90deg, var(--accent) var(--fill, 50%), var(--card-2) var(--fill, 50%)); }
input[type=range]::-moz-range-track { height: 4px; border-radius: 2px; background: linear-gradient(90deg, var(--accent) var(--fill, 50%), var(--card-2) var(--fill, 50%)); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; margin-top: -7px; border-radius: 50%; background: #f6c3a8; border: 0; box-shadow: 0 2px 6px rgba(0,0,0,0.4); }
input[type=range]::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%; background: #f6c3a8; border: 0; }

/* Sheets (add / edit / paste) */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 40; animation: fade .2s; }
.panel { position: fixed; left: 50%; transform: translateX(-50%); width: min(520px, 100%); z-index: 41; background: var(--solid); border: 1px solid var(--rim); }
.panel.full { top: calc(10px + var(--safe-t)); bottom: 0; border-radius: 18px 18px 0 0; border-bottom: 0; display: flex; flex-direction: column; animation: up .42s cubic-bezier(.2,1.15,.3,1); }
.panel.card { bottom: calc(12px + var(--safe-b)); width: min(496px, calc(100% - 24px)); border-radius: 22px; padding: 16px; box-shadow: 0 -10px 50px rgba(0,0,0,0.5); animation: up .25s cubic-bezier(.2,.8,.2,1); }
@keyframes up { from { transform: translate(-50%, 40px); opacity: 0; } }
@keyframes fade { from { opacity: 0; } }

.cebar { background: var(--solid) !important; border: 1px solid var(--rim); box-shadow: 0 10px 30px rgba(0,0,0,.4); }

.ce-w { display: inline-flex; flex-direction: column; align-items: flex-start; border: 0; background: none; padding: 0 1px; font: inherit; color: var(--fg); border-radius: 6px; text-align: left; }

.ce-chip.on, .ce-chips.q .ce-chip.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }

.smap { position: fixed; right: 0; top: calc(118px + var(--safe-t)); bottom: calc(118px + var(--safe-b)); width: 22px; z-index: 18; touch-action: none; transition: opacity .3s; }
.smap .sm-track, .smap .sm-fill { position: absolute; right: 10px; top: 0; width: 2px; border-radius: 2px; }
.smap .sm-track { bottom: 0; background: var(--rim); }

.smap .sm-m { position: absolute; right: 5px; transform: translateY(-50%); display: flex; align-items: center; gap: 8px; padding: 6px 0; border: 0; background: none; }
.smap .sm-m i { width: 11px; height: 11px; border-radius: 50%; background: var(--solid); border: 2px solid var(--muted); display: block; box-sizing: border-box; }
.smap .sm-m.past i { border-color: var(--accent); }

.smap .sm-m b { display: none; font: 600 11px var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--fg-2); background: var(--solid); border: 1px solid var(--rim); padding: 5px 9px; border-radius: 9px; white-space: nowrap; box-shadow: 0 6px 18px rgba(0,0,0,.35); }

.smap.away { opacity: 0 !important; pointer-events: none; }

.tappause.hint { width: auto; height: auto; margin: 0; transform: translateX(-50%); padding: 12px 18px; border-radius: 14px; font-size: 15px; animation: fade .2s; }
.stagechip { display: flex; align-items: center; gap: 8px; margin: 10px auto 0; background: none; border: 0; color: var(--muted); font-size: 14px; }
.stagechip svg { width: 16px; height: 16px; }
.stagechip b { font-weight: 600; color: var(--fg-2); }
.stagechip.on, .stagechip.on b { color: var(--accent); }
.nextline { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(92px + var(--safe-b)); z-index: 21; width: min(496px, calc(100% - 24px)); display: flex; align-items: baseline; gap: 8px; padding: 10px 14px; border-radius: 12px; background: color-mix(in srgb, var(--solid) 92%, transparent); border: 1px solid var(--rim); font-size: 14px; color: var(--fg-2); animation: fade .6s; white-space: nowrap; overflow: hidden; }

/* Stage mode: bigger, brighter, nothing extra on screen. */
body.stage #strip, body.stage .metarow { display: none; }

.ls-list { margin: 10px 0 6px; }
.ls-row { gap: 12px; }
.ls-row img, .ls-art { width: 44px; height: 44px; border-radius: 8px; flex: none; object-fit: cover; background: var(--card); display: grid; place-items: center; color: var(--muted); }

.tuner .pc-head { margin-bottom: 4px; }
.tu-sel { position: relative; margin-left: auto; display: inline-flex; align-items: center; gap: 4px; font-size: 14px; color: var(--fg); }

.tu-tick.mid { top: 8px; height: 28px; opacity: .8; }

.tu-needle.idle { opacity: .25; left: 50% !important; }
.tu-msg { text-align: center; font-size: 15px; color: var(--fg-2); margin: 10px 0 14px; min-height: 22px; }
.tu-msg.good { color: var(--accent); font-weight: 600; }
.tu-msg.warn { color: var(--muted); font-size: 14px; }
.tu-strings { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }

.ib .dotmark { position: absolute; top: 5px; right: 5px; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
.stat.listen svg, .stat.tunechip svg { width: 13px; height: 13px; color: var(--accent); }

.tappause { position: fixed; left: 50%; top: 40%; z-index: 60; width: 84px; height: 84px; margin: -42px 0 0 -42px; border-radius: 50%; display: grid; place-items: center; background: color-mix(in srgb, var(--solid) 85%, transparent); border: 1px solid var(--rim); color: var(--fg); pointer-events: none; animation: tp .7s ease-out forwards; }

.endnote { display: flex; align-items: center; justify-content: center; gap: 8px; margin: 28px 0 8px; font-size: 14px; color: var(--muted); animation: endin .9s ease-out both; }

@media (prefers-reduced-motion: reduce) { .endnote { animation: fade .3s; } }
.grab { width: 36px; height: 5px; border-radius: 3px; background: var(--rim); margin: 8px auto 4px; flex: none; }

.pbody { flex: 1; overflow-y: auto; padding: 0 16px calc(20px + var(--safe-b)); display: flex; flex-direction: column; }

.seg { display: flex; padding: 2px; border-radius: 9px; background: var(--card-2); flex: 1; }
.seg button { flex: 1; height: 28px; border-radius: 7px; border: 0; background: none; color: var(--muted); font-size: 14px; font-weight: 500; }

textarea.body { flex: 1; min-height: 260px; width: 100%; border-radius: var(--r); padding: 14px; font: 14px/1.55 var(--mono); resize: none; white-space: pre; overflow: auto; }

.preview { border-radius: var(--r); background: var(--card); border: 1px solid var(--hair); padding: 10px 14px; height: 96px; overflow: hidden; font: 13px/1.5 var(--mono); white-space: pre; margin-bottom: 12px; -webkit-mask-image: linear-gradient(180deg, #000 55%, transparent); mask-image: linear-gradient(180deg, #000 55%, transparent); }

.btn.primary { flex: 2; border: 0; background: var(--accent); color: var(--on-accent); font-weight: 600; }

/* Settings */
.set-group { border-radius: 16px; overflow: hidden; margin-top: 8px; }
.set { position: relative; display: flex; align-items: center; gap: 14px; width: 100%; min-height: 52px; padding: 0 14px; border: 0; border-bottom: 1px solid var(--hair); background: none; text-align: left; color: var(--fg); font-size: 16px; }
.set:last-child { border-bottom: 0; }
.set .tile { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; background: var(--card-2); border: 1px solid var(--rim); color: var(--fg-2); flex: none; }
.set .tile svg { width: 17px; height: 17px; }
.set .name { flex: 1; }
.set .val { color: var(--accent); font-size: 15px; }
.set .chev { color: var(--muted); width: 16px; height: 16px; }
.set select { position: absolute; inset: 0; opacity: 0; width: 100%; font-size: 16px; }
.toggle { width: 51px; height: 31px; border-radius: 16px; position: relative; flex: none; border: 0; padding: 0; background: var(--card-2); box-shadow: inset 0 0 0 1px var(--rim); transition: background .2s; }
.toggle::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,0.3); transition: transform .2s; }
.toggle.on { background: var(--accent); box-shadow: none; }
.toggle.on::after { transform: translateX(20px); }
.foot { color: var(--muted); font-size: 13px; line-height: 1.5; margin: 14px 6px 0; }

.toast { position: fixed; left: 50%; top: calc(12px + var(--safe-t)); transform: translate(-50%, -150%); padding: 10px 16px; border-radius: var(--r); z-index: 60; transition: transform .25s; font-size: 14px; background: var(--solid); border: 1px solid var(--rim); box-shadow: var(--shadow); }
.toast.show { transform: translate(-50%, 0); }
.toast { display: flex; align-items: center; gap: 14px; max-width: calc(100% - 32px); }
.tact { border: 0; background: none; color: var(--accent); font-weight: 600; font-size: 14px; padding: 4px 2px; flex: none; }
.toast.near { transform: translate(-50%, 6px); opacity: 0; transition: transform .18s ease-out, opacity .18s ease-out; padding: 8px 14px; font-size: 13px; white-space: nowrap; }
.toast.near.show { transform: translate(-50%, 0); opacity: 1; }
</style>
</head>
<body>
<div class="app" id="app"></div>
<div id="layer"></div>
<div class="toast" id="toast" role="status"></div>
<script type="module">
import { Tabs, SPEEDS, TRASH_DAYS, playsThisWeek, packShare, unpackShare, shareable, findSame, searchSongs, sortSongs, lastPlayed, TUNINGS, noteFreq, nearestNote, nearestString, detectTuning, detectPitch, rankTracks, linkService, firstLyric, chordModel, setChordAt, chordsUsed, parseSheet, parseBlocks, wrapTab, guessKey, transposeKey, prefersFlats, detectPaste, chordShape, transposeChord } from "./core.js";

// ---------- Icons ----------
const I = {

  camera: '<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>',

  amp: '<rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="13" r="3"/><path d="M15 10h3M15 13h3M15 16h3M6 8h12"/>',
  info: '<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/>',
  dots: '<circle cx="5.5" cy="12" r="1.3" fill="currentColor"/><circle cx="12" cy="12" r="1.3" fill="currentColor"/><circle cx="18.5" cy="12" r="1.3" fill="currentColor"/>',
  share: '<path d="M12 15V4M7.5 8.5 12 4l4.5 4.5"/><path d="M6 11H5v9h14v-9h-1"/>',
  loop: '<path d="M17 4l3 3-3 3"/><path d="M4 12V9a2 2 0 0 1 2-2h14"/><path d="M7 20l-3-3 3-3"/><path d="M20 12v3a2 2 0 0 1-2 2H4"/>',
  sliders: '<path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/>',
  fretboard: '<path d="M6 4h12M6 4v16M10 4v16M14 4v16M18 4v16M6 9h12M6 14h12"/><circle cx="10" cy="11.5" r="1.4" fill="currentColor"/><circle cx="14" cy="16.5" r="1.4" fill="currentColor"/>',
  clip: '<rect x="6" y="4" width="12" height="17" rx="2"/><path d="M9 4.5V3h6v1.5"/>',
  check: '<path d="M5 12l4 4 10-10"/>',
  play: '<path d="M8 5.5v13a1 1 0 0 0 1.5.9l10.4-6.5a1 1 0 0 0 0-1.8L9.5 4.6A1 1 0 0 0 8 5.5z"/>',
  pause: '<rect x="6" y="5" width="4" height="14" rx="1.3"/><rect x="14" y="5" width="4" height="14" rx="1.3"/>'
};
const icon = (n, cls = "") => `<svg class="i ${cls}" viewBox="0 0 24 24" aria-hidden="true">${I[n]}</svg>`;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const $ = id => document.getElementById(id);

// ---------- State ----------
let data = Tabs.load();
let query = "";
let filter = "all";
let draft = null; // prefilled fields for the add sheet
const app = $("app");
const layer = $("layer");

function applyTheme() {
  const light = data.settings.theme === "light";
  document.body.classList.toggle("stage", !!data.settings.stage);
  document.documentElement.dataset.theme = light ? "light" : "dark";
  document.querySelector('meta[name="theme-color"]').content = light ? "#f3f0eb" : "#0c0d0f";
}

// A short message. With `near`, it appears just above that control, where the eye already is.
function toast(msg, near, action) {
  const t = $("toast");
  clearTimeout(toast.timer);
  t.classList.remove("show", "near");
  t.style.left = t.style.top = "";
  t.textContent = msg;
  if (action) {
    const b = document.createElement("button");
    b.className = "tact";
    b.textContent = action.label;
    b.onclick = () => { clearTimeout(toast.timer); t.classList.remove("show"); action.fn(); };
    t.appendChild(b);
  }
  if (near) {
    const r = near.getBoundingClientRect();
    const above = (near.closest(".pw") || near).getBoundingClientRect().top;
    t.classList.add("near");
    const w = t.offsetWidth;
    const x = Math.min(window.innerWidth - w / 2 - 12, Math.max(w / 2 + 12, r.left + r.width / 2));
    t.style.left = x + "px";
    /* Near a header button there's no room above, so show it just below instead. */
    const top = above - t.offsetHeight - 10;
    t.style.top = (top < 12 ? r.bottom + 10 : top) + "px";
  }
  void t.offsetWidth; // restart the transition
  t.classList.add("show");
  toast.timer = setTimeout(() => t.classList.remove("show"), action ? 6000 : near ? 1400 : 2000);
}

const go = h => { location.hash = h; };
const route = () => {
  const [, name = "", id = ""] = location.hash.split("/");
  return { name: name || "library", id: decodeURIComponent(id) };
};
const keyOf = s => s.format === "tab" ? "TAB" : (s.key || guessKey(s.body || ""));

// Keep bottom bars above the iOS keyboard.
function followKeyboard() {
  const vv = window.visualViewport;
  if (!vv) return;
  const off = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
  document.querySelectorAll(".kb").forEach(el => {
    el.style.transform = `translate(-50%, ${-off}px)`;
  });
}
window.visualViewport?.addEventListener("resize", followKeyboard);
window.visualViewport?.addEventListener("scroll", followKeyboard);

// ---------- Keeping the library safe ----------
// Ask the browser to keep this site's storage permanently (it may still decide).
let storageKept = null;
navigator.storage?.persist?.().then(ok => { storageKept = ok; }).catch(() => {});
navigator.storage?.persisted?.().then(ok => { if (storageKept === null) storageKept = ok; }).catch(() => {});

const WEEK = 7 * 86400000;
function needsBackup() {
  if (!data.songs.length) return false;
  const s = data.settings, now = Date.now();
  if (s.backupSnooze && now < s.backupSnooze) return false;
  return !s.lastBackup || now - Date.parse(s.lastBackup) > WEEK;
}
function ago(iso) {
  if (!iso) return "never";
  const d = Math.floor((Date.now() - Date.parse(iso)) / 86400000);
  return d <= 0 ? "today" : d === 1 ? "yesterday" : `${d} days ago`;
}
// Share sheet first (Save to Files → iCloud Drive on iPhone); download otherwise.
async function backupNow() {
  const name = `tabs-backup-${new Date().toISOString().slice(0, 10)}.json`;
  const file = new File([Tabs.export(data)], name, { type: "application/json" });
  let done = false;
  if (navigator.canShare?.({ files: [file] })) {
    try { await navigator.share({ files: [file], title: "Tabs backup" }); done = true; }
    catch (e) { if (e.name === "AbortError") return false; }
  }
  if (!done) {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(file);
    a.download = name;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }
  data.settings.lastBackup = new Date().toISOString();
  data.settings.backupSnooze = null;
  Tabs.save(data);
  return true;
}

// ---------- Library ----------
function renderLibrary() {
  const hasFav = data.songs.some(s => s.favorite);
  const hasTab = data.songs.some(s => s.format === "tab");
  const hasLearn = data.songs.some(s => s.status === "learning");
  if ((filter === "fav" && !hasFav) || (filter === "tab" && !hasTab) || (filter === "learn" && !hasLearn)) filter = "all";
  const week = data.songs.map(playsThisWeek), weekTotal = week.reduce((a, b) => a + b, 0), weekSongs = week.filter(Boolean).length;
  app.innerHTML = `
    <div class="head">
      <h1 class="title">Library</h1>
      <div class="row-btns">
        <button class="ib glass" id="tunerbtn" aria-label="${tunedRecently() ? "Tuner" : "Tuner. Not tuned in the last few hours"}">${icon("fork")}${tunedRecently() ? "" : '<i class="dotmark"></i>'}</button>
        <button class="ib glass" id="settings" aria-label="Settings">${icon("gear")}</button>
      </div>
    </div>
    ${weekTotal ? `<div class="weekly">This week: ${weekTotal} play${weekTotal === 1 ? "" : "s"} across ${weekSongs} song${weekSongs === 1 ? "" : "s"}</div>` : ""}
    ${data.songs.length ? `<div class="chips" id="chips">
      <button class="chip ${filter === "all" ? "on" : ""}" data-f="all">All</button>
      <button class="chip ${filter === "sets" ? "on" : ""}" data-f="sets">Sets</button>
      ${hasFav ? `<button class="chip ${filter === "fav" ? "on" : ""}" data-f="fav">Favorites</button>` : ""}
      ${hasLearn ? `<button class="chip ${filter === "learn" ? "on" : ""}" data-f="learn">Learning</button>` : ""}
      ${hasTab ? `<button class="chip ${filter === "tab" ? "on" : ""}" data-f="tab">Tabs</button>` : ""}
    </div>` : ""}
    ${needsBackup() ? `<div class="bk glass" id="bk">
      <span class="tile">${icon("cloud")}</span>
      <div class="bk-t"><b>Back up your library</b><span>${data.settings.lastBackup ? `Last backup ${ago(data.settings.lastBackup)}` : "Not backed up yet"}. Save it to iCloud Drive.</span></div>
      <div class="bk-b"><button class="btn sm" id="bk-later">Later</button><button class="btn sm primary" id="bk-go">Back up</button></div>
    </div>` : ""}
    <div id="list"></div>
    <div class="dock-fade"></div>
    <div class="dock kb">
      <label class="cmd glass float">
        ${icon("search")}
        <input id="q" type="text" inputmode="search" enterkeyhint="go" placeholder="Search, or paste a song" value="${esc(query)}" autocomplete="off" autocorrect="off" spellcheck="false" aria-label="Search or paste a song">
        <button class="clear" id="clear" aria-label="Clear search" ${query ? "" : "hidden"}>${icon("x")}</button>
      </label>
      <button class="add" id="add" aria-label="Add song">${icon("plus")}</button>
    </div>`;
  $("settings").onclick = () => go("#/settings");
  $("tunerbtn").onclick = () => openTuner("standard", () => route().name === "library" && renderLibrary());
  $("bk-later")?.addEventListener("click", () => { data.settings.backupSnooze = Date.now() + 2 * 86400000; Tabs.save(data); $("bk").remove(); });
  $("bk-go")?.addEventListener("click", async () => { if (await backupNow()) { $("bk")?.remove(); toast("Backed up"); } });
  $("add").onclick = () => { draft = null; go("#/add"); };
  app.querySelectorAll("[data-f]").forEach(b => b.onclick = () => { filter = b.dataset.f; renderLibrary(); });
  const q = $("q");
  q.oninput = () => { query = q.value; $("clear").hidden = !query; renderList(); };
  q.onkeydown = e => {
    if (e.key !== "Enter") return;
    const first = app.querySelector("#list .row");
    if (first) first.click();
  };
  q.addEventListener("paste", e => {
    const text = e.clipboardData?.getData("text") || "";
    /* A pasted share link opens the same "Shared with you" sheet as tapping it. */
    const link = text.match(/#\/import\/([zj][A-Za-z0-9_-]+)/);
    if (link) { e.preventDefault(); q.blur(); return renderImport(link[1]); }
    if (text.trim().split("\n").filter(l => l.trim()).length < 2) return;
    e.preventDefault();
    q.blur();
    showPasteCard(detectPaste(text));
  });
  $("clear").onclick = e => { e.preventDefault(); query = ""; q.value = ""; $("clear").hidden = true; renderList(); q.focus(); };
  renderList();
  followKeyboard();
  setTimeout(() => { if (route().name === "library" && !layer.innerHTML) showTips("library"); }, 400);
}

const STATUS = { learning: "Learning", got: "Got it" };
const SORTS = { title: "A–Z", recent: "Recently played", most: "Most played", key: "Key" };
// A lyric that matched the search, with the matching words marked.
function lyricHit(line, q) {
  const i = line.toLowerCase().indexOf(q.trim().toLowerCase());
  if (i < 0) return `“${esc(line)}”`;
  const n = q.trim().length, from = Math.max(0, i - 24);
  return `“${from ? "…" : ""}${esc(line.slice(from, i))}<mark>${esc(line.slice(i, i + n))}</mark>${esc(line.slice(i + n))}”`;
}
function songRow(s, hit) {
  const wk = playsThisWeek(s), sort = data.settings.sort, n = s.plays?.length || 0;
  const when = sort === "recent" && lastPlayed(s) ? ago(new Date(lastPlayed(s)).toISOString()) : "";
  const stat = sort === "most" && n ? `${n} play${n === 1 ? "" : "s"}` : when ? `Played ${when}` : wk && `Played ${wk}× this week`;
  const sub = hit ? `<span class="hit">${hit}</span>`
    : [esc(s.artist || "Unknown artist"), STATUS[s.status] && `<span class="st ${s.status}">${STATUS[s.status]}</span>`, stat].filter(Boolean).join(" · ");
  return `<button class="row" data-id="${esc(s.id)}"${s.id === lastOpened ? ' style="view-transition-name: song-title"' : ""}>
    <div class="txt"><div class="t">${esc(s.title)}</div><div class="a">${sub}</div></div>
    ${s.favorite ? `<svg class="heart" viewBox="0 0 24 24" aria-label="Favorite" role="img">${I.heart}</svg>` : ""}
    <span class="k">${esc(keyOf(s))}</span>
  </button>`;
}

function renderList() {
  const list = $("list");
  if (!data.songs.length) {
    list.innerHTML = `<div class="empty">No songs yet.<br>Paste a chord sheet into the bar below,<br>or tap + to write one.</div>`;
    return;
  }
  const q = query.trim().toLowerCase();
  if (filter === "sets") {
    const sets = data.sets.filter(x => !q || x.name.toLowerCase().includes(q));
    list.innerHTML = `
      <div class="label">Sets</div>
      <div class="list glass">
        ${sets.map(x => { const n = setSongs(x).length; return `<button class="row" data-set="${esc(x.id)}">
          <div class="txt"><div class="t">${esc(x.name)}</div><div class="a">${n} song${n === 1 ? "" : "s"}${n ? ` · about ${Math.round(setLength(x) / 60)} min` : ""}</div></div>
          ${icon("chev", "chev")}</button>`; }).join("")}
        <button class="row newset" id="newset"><div class="txt"><div class="t">${icon("plus")} New set</div></div></button>
      </div>`;
    list.querySelectorAll("[data-set]").forEach(el => el.onclick = () => go("#/set/" + encodeURIComponent(el.dataset.set)));
    $("newset").onclick = () => { const name = prompt("Name this set", "New set"); if (name === null) return; const x = Tabs.addSet(data, name.trim() || "New set"); go("#/set/" + encodeURIComponent(x.id)); };
    return;
  }
  const pool = data.songs.filter(s =>
    (filter !== "fav" || s.favorite) && (filter !== "tab" || s.format === "tab") && (filter !== "learn" || s.status === "learning"));
  /* Searching: title and artist matches first, then songs whose lyrics have the words. */
  const found = q ? searchSongs(pool, q) : null;
  const sort = SORTS[data.settings.sort] ? data.settings.sort : "title";
  const recent = !q && filter === "all" && sort !== "recent" && data.songs.length >= 4
    ? data.songs.filter(s => s.opened).sort((a, b) => b.opened - a.opened).slice(0, 2) : [];
  const sorted = found ? found.map(x => x.song) : sortSongs(pool, sort, keyOf);
  const hits = new Map((found || []).filter(x => x.line).map(x => [x.song.id, lyricHit(x.line, q)]));

  list.innerHTML = `
    ${recent.length ? `<div class="label">Recent</div><div class="recent">${recent.map(s => `
      <button class="rc glass" data-id="${esc(s.id)}">
        <div class="t">${esc(s.title)}</div>
        <div class="a">${esc(s.artist || "Unknown artist")}</div>
      </button>`).join("")}</div>` : ""}
    ${q ? "" : `<div class="label lrow"><span>${filter === "fav" ? "Favorites" : filter === "tab" ? "Tabs" : filter === "learn" ? "Learning" : "All songs"}</span>
      <label class="sortby">${esc(SORTS[sort])}${icon("chev", "chev")}<select id="sort" aria-label="Sort songs">${Object.entries(SORTS).map(([k, v]) => `<option value="${k}" ${k === sort ? "selected" : ""}>${v}</option>`).join("")}</select></label></div>`}
    ${sorted.length ? `<div class="list glass" style="${q ? "margin-top:18px" : ""}">${sorted.map(s => songRow(s, hits.get(s.id))).join("")}</div>` : `<div class="empty">No matches for "${esc(query)}" in titles, artists or lyrics.</div>`}`;
  $("sort")?.addEventListener("change", e => { data.settings.sort = e.target.value; Tabs.save(data); renderList(); });
  list.querySelectorAll("[data-id]").forEach(el => el.onclick = () => {
    setCtx = null;
    // Name this row's title so it glides into the song header.
    list.querySelectorAll("[data-id], .t").forEach(t => t.style.viewTransitionName = "");
    el.querySelector(".t").style.viewTransitionName = "song-title";
    go("#/song/" + encodeURIComponent(el.dataset.id));
  });
}

// ---------- AI help (optional, your own Anthropic key) ----------
// No server: the key stays in this browser's storage and is sent only to
// api.anthropic.com, using Anthropic's header for direct browser access.
// Without a key the app works as usual and the AI options don't appear.
const AI = { store: "tabs.apikey.v1", fast: "claude-haiku-5-5", vision: "claude-sonnet-5-5" };
function aiKey() { try { return localStorage.getItem(AI.store) || ""; } catch { return ""; } }

async function askClaude({ model = AI.fast, system, content, maxTokens = 8000, key = aiKey() }) {
  let r;
  try {
    r = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "content-type": "application/json", "x-api-key": key, "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true" },
      body: JSON.stringify({ model, max_tokens: maxTokens, system, messages: [{ role: "user", content }] })
    });
  } catch { throw Object.assign(new Error("network"), { status: 0, model }); }
  if (!r.ok) {
    // Read Anthropic's error body so the real reason can be explained.
    const j = await r.json().catch(() => ({}));
    throw Object.assign(new Error(j?.error?.message || "HTTP " + r.status), { status: r.status, model });
  }
  const j = await r.json();
  return (j.content || []).filter(c => c.type === "text").map(c => c.text).join("");
}

// Plain-English reasons, mapped from Anthropic's status codes.
function aiError(e) {
  const m = e?.message || "", st = e?.status;
  if (st === -1) return "Couldn't make sense of that. Try again, or keep the original.";
  if (!st) return "Could not reach Anthropic. Check the connection, and turn off any content blocker or VPN filtering for this site.";
  if (st === 401) return "Key not recognized. Copy it again from the Anthropic Console (it starts with sk-ant-).";
  if (st === 403) return "Key is valid but not allowed to do this. Check the key's workspace permissions in the Console.";
  if (st === 400 && /credit|balance|billing/i.test(m)) return "The account has no credit. Add credit under Billing in the Console.";
  if (st === 404) return `Model not found (${e.model}). The model name may need updating.`;
  if (st === 413 || /too large|exceeds/i.test(m)) return "That photo is too large. Try a closer, simpler shot of the page.";
  if (st === 429) return "Rate or spend limit reached. Check Limits in the Console, or wait a minute.";
  if (st >= 500) return "Anthropic is busy or down. Try again in a few minutes.";
  return `Request failed (HTTP ${st}).`;
}

function parseJSON(text) {
  const m = String(text).match(/\{[\s\S]*\}/);
  try { return JSON.parse(m[0]); } catch { throw Object.assign(new Error("bad json"), { status: -1 }); }
}

const CLEAN_SYSTEM = `You format guitar chord sheets for a phone app. The input is one song, pasted from a website or photographed from a page.
Reply with JSON only, no other text: {"title": string, "artist": string, "key": string, "format": "chords" or "tab", "sheet": string}
Rules for "sheet":
- Chords go on their own line directly above the lyric line, each chord starting at the column of the syllable where it changes.
- Section labels go on their own line in square brackets, like [Intro], [Verse 1], [Chorus], [Bridge]. One blank line between sections.
- Lines of only chords (intros, instrumentals) stay as chord lines. ASCII tab lines are kept exactly as written.
- If the source states a capo, put [Capo N] as the first line.
- Keep the song's words and chords exactly as given. Do not add, complete, translate or correct lyrics, do not invent chords, and do not transpose.
- Use standard chord spellings: G, Am, F#m7, Bb, Dsus4, D/F#.
- Remove everything that is not the song: ads, ratings, comments, site menus, credits, strumming legends, chord diagram text.
"title", "artist": from the source if present, else "". "key": the key if stated or clear from the chords (like G or Em), else "". "format": "tab" only if the song is mainly ASCII tab.`;

// Clean up pasted text, or read a photographed page, into the app's chord sheet format.
async function cleanSheet({ text, image }) {
  const content = image
    ? [{ type: "image", source: { type: "base64", media_type: image.type, data: image.data } },
       { type: "text", text: "Transcribe the chord sheet on this page." }]
    : [{ type: "text", text: "Clean up this pasted song:\n\n" + text }];
  const out = parseJSON(await askClaude({ model: image ? AI.vision : AI.fast, system: CLEAN_SYSTEM, content }));
  const sheet = String(out.sheet || "").replace(/\r\n?/g, "\n").replace(/\s+$/, "");
  if (!sheet.trim()) throw Object.assign(new Error("empty"), { status: -1 });
  const d = detectPaste(sheet);
  return {
    title: String(out.title || d.title || "").trim(),
    artist: String(out.artist || d.artist || "").trim(),
    key: String(out.key || "").trim().slice(0, 4),
    format: out.format === "tab" || d.format === "tab" ? "tab" : "chords",
    body: d.title ? d.body : sheet,
    sections: d.sections
  };
}

// Shrink a photo to a size the API accepts quickly, as JPEG base64.
async function readPhoto(file, max = 1600) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((ok, bad) => { const i = new Image(); i.onload = () => ok(i); i.onerror = bad; i.src = url; });
    const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement("canvas");
    c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    return { type: "image/jpeg", data: c.toDataURL("image/jpeg", 0.85).split(",")[1] };
  } finally { URL.revokeObjectURL(url); }
}

function showPasteCard(original) {
  let cleaned = null, useCleaned = false, working = false;
  const cur = () => (useCleaned && cleaned) || original;
  layer.innerHTML = `
    <div class="scrim" id="scrim"></div>
    <div class="panel card kb" role="dialog" aria-label="Save pasted song">
      <div class="pc-head">${icon("clip")}<span id="p-what"></span><span style="flex:1"></span>
        <div class="seg mini" id="p-ver" hidden><button data-v="0">Original</button><button data-v="1">Cleaned</button></div>
      </div>
      <div class="preview" id="p-prev"></div>
      <div class="tags" id="p-tags"></div>
      <div class="ai-note" id="p-note" hidden></div>
      <div class="fields glass">
        <label class="fld"><span class="lab">Title</span><input id="p-title" value="${esc(original.title)}" placeholder="Song title" autocomplete="off"></label>
        <label class="fld"><span class="lab">Artist</span><input id="p-artist" value="${esc(original.artist)}" placeholder="Optional" autocomplete="off"></label>
      </div>
      <div class="actions">
        <button class="btn" id="p-edit">Review</button>
        ${aiKey() ? `<button class="btn" id="p-clean">${icon("wand")}Clean up</button>` : ""}
        <button class="btn primary" id="p-save">Save to Library</button>
      </div>
    </div>`;
  const show = () => {
    const d = cur();
    $("p-what").textContent = `${d.format === "tab" ? "Tab" : "Chord sheet"} ${useCleaned ? "cleaned up" : "detected"}`;
    $("p-prev").innerHTML = parseSheet(d.body).slice(0, 6).map(l =>
      l.kind === "chords" ? `<span class="ch">${esc(l.text)}</span>` : l.kind === "section" ? `[${esc(l.text)}]` : esc(l.text)).join("\n");
    const key = d.key || (d.format === "chords" ? guessKey(d.body) : "");
    const tags = [d.format === "tab" ? "Tab" : "Chords", key && `Key ${key}`, d.sections && `${d.sections} section${d.sections === 1 ? "" : "s"}`].filter(Boolean);
    $("p-tags").innerHTML = tags.map(t => `<span class="tag">${esc(t)}</span>`).join("");
    $("p-ver").hidden = !cleaned;
    layer.querySelectorAll("#p-ver button").forEach(b => b.classList.toggle("on", (b.dataset.v === "1") === useCleaned));
  };
  show();
  const close = () => { layer.innerHTML = ""; };
  $("scrim").onclick = () => { if (!working) close(); };
  layer.querySelectorAll("#p-ver button").forEach(b => b.onclick = () => { useCleaned = b.dataset.v === "1"; show(); });
  $("p-clean")?.addEventListener("click", async () => {
    if (working) return;
    if (cleaned) { useCleaned = true; show(); return; }
    working = true;
    const btn = $("p-clean");
    btn.disabled = true; btn.innerHTML = busy("Cleaning");
    $("p-note").hidden = true;
    try {
      cleaned = await cleanSheet({ text: original.body });
      useCleaned = true;
      // Fill in what the cleanup found, without overwriting anything typed.
      if (!$("p-title").value.trim() && cleaned.title) $("p-title").value = cleaned.title;
      if (!$("p-artist").value.trim() && cleaned.artist) $("p-artist").value = cleaned.artist;
      show();
      btn.innerHTML = `${icon("check")}Cleaned`;
    } catch (e) {
      $("p-note").textContent = aiError(e); $("p-note").hidden = false;
      btn.disabled = false; btn.innerHTML = `${icon("wand")}Clean up`;
    }
    working = false;
  });
  const fields = () => {
    const d = cur();
    return { title: $("p-title").value.trim(), artist: $("p-artist").value.trim(), format: d.format, key: useCleaned ? (d.key || "") : "", body: d.body };
  };
  $("p-save").onclick = () => {
    if (working) return;
    const f = fields();
    if (!f.title) { $("p-title").focus(); toast("Add a title first"); return; }
    const s = Tabs.addSong(data, f);
    close(); query = "";
    go("#/song/" + encodeURIComponent(s.id));
  };
  $("p-edit").onclick = () => { if (working) return; draft = fields(); close(); go("#/add"); };
  if (!original.title) setTimeout(() => $("p-title")?.focus(), 250);
  followKeyboard();
}
