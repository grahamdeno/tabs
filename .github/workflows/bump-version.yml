name: bump version

# Off by default: runs only by hand (Actions > bump version > Run workflow) and
# refuses to run on main. It commits to the branch it runs on. Nothing bumps
# the version automatically; the bump happens on next before Graham tests.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bump-version
  cancel-in-progress: false

jobs:
  bump:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 100
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bump if needed
        id: bump
        run: echo "version=$(bash .github/scripts/bump-version.sh '${{ github.event.before }}')" >> "$GITHUB_OUTPUT"
      - name: Test, commit and push
        if: steps.bump.outputs.version != ''
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          node --test
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Release $VERSION: bump version so installed apps update"
          for i in 1 2 3; do
            git push origin HEAD:${{ github.ref_name }} && exit 0
            git pull --rebase origin ${{ github.ref_name }}
          done
          exit 1
