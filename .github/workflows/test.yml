name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test
      - run: npx --yes eslint@10.1.0 .

  # The real app in Chromium: loading, playing, search, Edit, sets, sharing, settings, iPad.
  browser:
    runs-on: ubuntu-24.04   # pinned to match the reference screenshots (see screens.yml)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock playwright@1.56.1 axe-core@4.10.2
      - run: npx playwright install --with-deps chromium
      # app: features end to end; regress: the main path at three sizes and both
      # themes; a11y: names and axe; visual: screens compared with tests/visual/ci.
      - name: browser tests
        shell: bash
        env:
          # Compare screens against references made on GitHub, once they exist.
          VISUAL: ${{ hashFiles('tests/visual/ci/*.png') != '' && 'compare' || '' }}
          VISUAL_DIR: tests/visual/ci
        run: |
          set +e -o pipefail
          node --test tests/e2e/*.e2e.mjs 2>&1 | tee e2e.log
          status=$?
          if [ $status -ne 0 ]; then
            # One annotation with what failed, readable from the run's summary and the API.
            msg=$( { grep -aE "^not ok|Error|^\s+(error|expected|actual):|\(serious\)|\(critical\)|no name:|PROBLEM" e2e.log || tail -40 e2e.log; } | head -60 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Browser tests failed::$msg"
          fi
          [ "$VISUAL" = compare ] && echo "::notice title=Screens::compared with the references in tests/visual/ci"
          exit $status
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screens
          path: test-results/visual
          if-no-files-found: ignore
