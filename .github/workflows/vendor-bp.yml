name: vendor basic pitch
on: { push: { branches: [strum-2.9.0] } }
permissions: { contents: write }
jobs:
  vendor:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: inspect
        run: |
          mkdir -p /tmp/bp && cd /tmp/bp && npm init -y >/dev/null
          npm install --no-audit --no-fund @spotify/basic-pitch @tensorflow/tfjs esbuild > install.log 2>&1 || true
          {
            echo "== versions"; node -e "for (const p of ['@spotify/basic-pitch','@tensorflow/tfjs','esbuild']) { try { console.log(p, require(p + '/package.json').version) } catch (e) { console.log(p, 'missing') } }"
            echo "== basic-pitch package.json"; node -e "const j=require('@spotify/basic-pitch/package.json'); console.log(JSON.stringify({main:j.main,module:j.module,browser:j.browser,exports:j.exports,types:j.types,dependencies:j.dependencies,license:j.license},null,1))"
            echo "== files"; find node_modules/@spotify/basic-pitch -type f -not -path "*/node_modules/*/node_modules/*" | sed 's|node_modules/@spotify/basic-pitch/||' | head -80
            echo "== model sizes"; du -a node_modules/@spotify/basic-pitch/model 2>/dev/null | head
            echo "== install tail"; tail -5 install.log
          } > $GITHUB_WORKSPACE/bp-inspect.txt 2>&1
      - name: commit
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bp-inspect.txt; git commit -qm "basic pitch: inspect"; git push
